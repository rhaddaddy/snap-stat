# Temporary (round 6): saves copies of a few public pages so their formats can be checked. Safe to delete.
name: Peek at data sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/peek.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p debug
          UA="Mozilla/5.0 (compatible; SNAP-Stat-card-updater/1.0)"
          get() { curl -sSL -A "$UA" --max-time 60 -o "debug/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 failed"; }
          get sf-albums.html "https://snap.fan/albums/"
          get sf-splits.html "https://snap.fan/cosmetics/split-effects/"
          ls -la debug
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add debug
          git diff --cached --quiet || (git commit -m "Peek at data sources" && git pull --rebase && git push)
