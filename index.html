<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SNAP Stat">
<meta name="description" content="Unofficial fan-made MARVEL SNAP companion: match tracker, collection, decks, seasons and alliance.">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<title>SNAP Stat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one scrolling view, fixed bottom tab bar, bottom sheets for detail and forms.
   Look: deep-space nebula ground, comic lettering for page titles, halftone panels, blue energy / orange power pips,
   and a yellow-to-orange "snap" gradient reserved for the main action on each screen. Dark-first; light mirrors it as comic paper. */
:root {
  --bg: #0A0918;
  --glow-1: rgba(120, 72, 255, .28);
  --glow-2: rgba(0, 160, 255, .16);
  --surface: #15132B;
  --surface-2: #201D40;
  --line: #2F2A5C;
  --fg: #F2EFFF;
  --muted: #A39DC9;
  --snap-a: #FFD23F;
  --snap-b: #FF7A1A;
  --snap-ink: #1A0E00;
  --snap-text: #FFC53D;
  --snap-soft: rgba(255, 197, 61, .13);
  --cost: #3D8BFF;
  --power: #FF8A2B;
  --cube: #8FE3FF;
  --win: #3DD68C;
  --loss: #FF5D7B;
  --tie: #B4AED3;
  --warn: #FFB547;
  --dot: rgba(255, 255, 255, .07);
  --shadow: 0 18px 40px rgba(0, 0, 0, .5);
  --comic: "Bangers", "Impact", "Arial Narrow", sans-serif;
  --ui: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6F3FF; --glow-1: rgba(120, 72, 255, .12); --glow-2: rgba(0, 160, 255, .10); --surface: #FFFFFF; --surface-2: #EEE9FB;
    --line: #D9D1F2; --fg: #17132E; --muted: #5B557C; --snap-ink: #1A0E00; --snap-text: #A85F00; --snap-soft: rgba(224, 140, 0, .12);
    --cost: #2565E0; --power: #DB6412; --cube: #0B7FB0; --win: #0F8A52; --loss: #CC2F4C; --tie: #6F6893; --warn: #9A6200;
    --dot: rgba(23, 19, 46, .07); --shadow: 0 18px 40px rgba(40, 30, 90, .18); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F6F3FF; --glow-1: rgba(120, 72, 255, .12); --glow-2: rgba(0, 160, 255, .10); --surface: #FFFFFF; --surface-2: #EEE9FB;
  --line: #D9D1F2; --fg: #17132E; --muted: #5B557C; --snap-ink: #1A0E00; --snap-text: #A85F00; --snap-soft: rgba(224, 140, 0, .12);
  --cost: #2565E0; --power: #DB6412; --cube: #0B7FB0; --win: #0F8A52; --loss: #CC2F4C; --tie: #6F6893; --warn: #9A6200;
  --dot: rgba(23, 19, 46, .07); --shadow: 0 18px 40px rgba(40, 30, 90, .18); color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: radial-gradient(1200px 600px at 85% -10%, var(--glow-1), transparent 60%), radial-gradient(900px 500px at -10% 30%, var(--glow-2), transparent 60%), var(--bg);
  background-attachment: fixed; color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(80px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--snap-a); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.wrap { max-width: 780px; margin: 0 auto; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top > div:first-child { min-width: 0; flex: 1 1 auto; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--comic); font-size: 24px; letter-spacing: .04em; white-space: nowrap; line-height: 1; min-width: 0; }
.brand > span { overflow: hidden; text-overflow: ellipsis; padding: .06em .22em .06em 0; } /* room for the slanted letters, so the last T isn't clipped */
.brand .ic { width: 28px; height: 28px; color: var(--cube); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--cube) 60%, transparent)); }
.brand b { font-weight: 400; color: var(--cube); }
.sync { font-family: var(--ui); font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.me-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; max-width: 46%; min-width: 0; flex: 0 1 auto; }
.me-chip span.h { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

/* Avatars: stylized tiles (never official art) or the person's own uploaded picture */
.av { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-family: var(--comic); font-size: 17px; flex: none; color: #fff; overflow: hidden; position: relative; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.lg { width: 76px; height: 76px; border-radius: 18px; font-size: 40px; border: 3px solid var(--bg); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.art { background-image: radial-gradient(var(--artdot, rgba(255,255,255,.22)) 1px, transparent 1.5px), linear-gradient(150deg, var(--a1), var(--a2)); background-size: 5px 5px, 100% 100%; }

/* Bottom nav */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); font-family: var(--ui); font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 10px; position: relative; }
.tabs button .ic { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--snap-text); background: var(--snap-soft); }
.tabs .badge { position: absolute; top: 2px; right: 22%; min-width: 16px; height: 16px; border-radius: 8px; background: var(--loss); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

.ic { width: 18px; height: 18px; flex: none; }
.cube { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.cube .ic { width: 14px; height: 14px; color: var(--cube); }

/* Type */
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--comic); font-weight: 400; font-size: 38px; letter-spacing: .03em; line-height: 1; background: linear-gradient(180deg, var(--snap-a), var(--snap-b)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.35)); }
h2 { font-family: var(--ui); font-size: 21px; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .02em; }
h3 { font-family: var(--ui); font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.eyebrow { font-family: var(--ui); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.num { font-family: var(--ui); font-variant-numeric: tabular-nums; }
p { margin: 0; }

/* Structure */
#view { display: flex; flex-direction: column; gap: 22px; padding-block: 18px 12px; }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; } .row.nowrap { flex-wrap: nowrap; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.halftone { position: relative; isolation: isolate; overflow: hidden; }
.halftone::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(var(--dot) 1.2px, transparent 1.6px); background-size: 7px 7px; pointer-events: none; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.li { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); min-width: 0; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.li:hover { background: var(--surface-2); }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; color: var(--muted); }
.empty strong { color: var(--fg); }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 9px 14px; font-weight: 600; min-height: 40px; }
a.btn { color: var(--fg); text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.snap { background: linear-gradient(180deg, var(--snap-a), var(--snap-b)); color: var(--snap-ink); border-color: transparent; font-family: var(--ui); font-weight: 800; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.snap.sm { font-size: 13px; }
.btn.danger { color: var(--loss); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 7px 4px; font-family: var(--ui); font-weight: 700; font-size: 14px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.seg button { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg:has(> button:nth-child(4)) button { font-size: 13px; letter-spacing: .01em; padding-inline: 2px; }
.seg:has(> button:nth-child(5)) button { font-size: 12.5px; letter-spacing: 0; text-transform: none; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line), inset 0 -2px 0 var(--snap-a); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em; min-width: 0; }
input[type=text], input[type=number], input[type=search], input[type=date], input[type=datetime-local], input[type=email], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font-size: 15px; color: var(--fg); min-width: 0; }
textarea { resize: vertical; min-height: 70px; }
textarea.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; min-height: 120px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--fg); }
.check input { width: 18px; height: 18px; accent-color: var(--snap-b); flex: none; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toggle-row:last-child { border-bottom: 0; }

/* Pills / state */
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.pill.W { background: color-mix(in srgb, var(--win) 18%, transparent); color: var(--win); }
.pill.L { background: color-mix(in srgb, var(--loss) 18%, transparent); color: var(--loss); }
.pill.T { background: color-mix(in srgb, var(--tie) 20%, transparent); color: var(--tie); }
.pill.gold { background: var(--snap-soft); color: var(--snap-text); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.dim { background: var(--surface-2); color: var(--muted); }
.pill.live { background: color-mix(in srgb, var(--loss) 20%, transparent); color: var(--loss); }
.pos { color: var(--win); } .neg { color: var(--loss); }
.rank { display: inline-grid; place-items: center; min-width: 46px; height: 46px; padding: 0 6px; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); background: linear-gradient(160deg, #7C5CFF, #2D1E7A); color: #fff; font-family: var(--ui); font-weight: 800; font-size: 17px; }
.rank.inf { background: linear-gradient(160deg, var(--snap-a), var(--snap-b)); color: var(--snap-ink); font-size: 13px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--snap-a), var(--snap-b)); border-radius: 99px; }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.tile .v { font-family: var(--ui); font-weight: 800; font-size: 25px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .k { font-family: var(--ui); font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.hero-stat { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.ring { width: 96px; height: 96px; }
.ring text { font-family: var(--ui); font-weight: 800; fill: var(--fg); }
.wallet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.wallet button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 10px; min-width: 0; }
.wallet .v { font-family: var(--ui); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.wallet .k { font-family: var(--ui); font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--ui); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

/* Season hero */
.season { border-radius: 18px; padding: 16px; color: #fff; background: linear-gradient(135deg, #4B2BD6, #1A1260 55%, #0B2F6E); border: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; gap: 10px; }
.season .nm { font-family: var(--comic); font-size: 32px; line-height: 1; letter-spacing: .03em; text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.season .eyebrow { color: rgba(255,255,255,.75); }
.season .bar { background: rgba(255,255,255,.18); }
.season .muted { color: rgba(255,255,255,.75); }
.season .halftone-dots { --dot: rgba(255,255,255,.08); }
.ev { display: flex; gap: 10px; align-items: center; }
.ev .when { font-family: var(--ui); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

/* Card tiles: original design, cost pip left (blue), power pip right (orange); stylized fills, never official art */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.ct { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 12px; border: 2px solid rgba(255,255,255,.14); padding: 30px 7px 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; min-width: 0; color: #fff; overflow: hidden; }
.ct .nm { font-family: var(--ui); font-weight: 800; font-size: 14px; line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; text-shadow: 0 1px 2px rgba(0,0,0,.7); position: relative; }
.ct .sub { font-size: 10.5px; opacity: .85; position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.ct .glyph { position: absolute; inset: 22% 0 auto; text-align: center; font-family: var(--comic); font-size: 44px; opacity: .3; }
.pip { position: absolute; top: 5px; width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-family: var(--ui); font-weight: 800; font-size: 15px; color: #fff; border: 2px solid rgba(255,255,255,.7); box-shadow: 0 1px 3px rgba(0,0,0,.5); z-index: 1; }
.pip.cost { left: 5px; background: var(--cost); }
.pip.pow { right: 5px; background: var(--power); }
.ct.miss { filter: grayscale(.85) brightness(.7); border-style: dashed; }
.ct.own { border-color: color-mix(in srgb, var(--snap-a) 55%, transparent); }
.ct .tag { position: absolute; top: 34px; right: 6px; font-size: 13px; color: var(--snap-a); text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.ct .tag.l { left: 6px; right: auto; }
.series-row { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; color: inherit; text-align: left; width: 100%; }
.series-row .lbl { font-weight: 700; font-size: 13px; }
.series-row[aria-pressed="true"] .lbl { color: var(--snap-text); }
a.li { color: inherit; text-decoration: none; }
.cwrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cwrap .ct .nm { display: none; }
.cname { display: flex; align-items: flex-start; min-width: 0; }
.cname .t { flex: 1; min-width: 0; padding: 4px 0 0 2px; font-size: 12px; font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.star { flex: none; width: 32px; height: 28px; margin: 0 -4px 0 0; padding: 0; border: 0; background: none; font-size: 19px; line-height: 1; color: var(--muted); cursor: pointer; }
.star[aria-pressed="true"] { color: var(--snap-text); }
.ct .cimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.ct.has-img { background: transparent; border-color: transparent; padding: 0; width: 100%; }
.ct.has-img.miss { border-color: transparent; }
.ct.has-img .glyph, .ct.has-img .pip, .ct.has-img .nm { display: none; }
.ct.has-img .sub { position: absolute; left: 4px; right: 4px; bottom: 2px; background: rgba(10,9,24,.8); border-radius: 6px; padding: 1px 5px; }
.ct.has-img .tag { top: auto; bottom: 20px; z-index: 1; }
.ct.has-img .tag.l { left: 4px; } .ct.has-img .tag:not(.l) { right: 4px; }
.banner.has-img .big { display: none; }
.av .aimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
.vthumb { width: 44px; height: 58px; object-fit: contain; flex: none; }
.vprev { display: grid; place-items: center; }

function cubeChart(pm) {

function predictionHtml() {

    ${arr(p.watchOut).length ? `<span class="eyebrow">Play around</span><ul style="margin:0;padding-left:18px" class="small">${arr(p.watchOut).slice(0, 4).map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}

async function runPredict() {
  live.predBusy = true; render();
  try {
    if (!store.sample) live.pred = predictLocal();
    else {
      const seen = live.opp.map((o) => `${card(o.key).name} (${o.zone.startsWith("L") ? "played at " + (live.locs[num(o.zone.slice(1))] || "location " + (num(o.zone.slice(1)) + 1)) : o.zone}${o.turn ? ", turn " + o.turn : ""})`).join("; ");
      const history = predictLocal().deck.slice(0, 8).map((d) => d.name).join(", ");
      const prompt = `You are a MARVEL SNAP expert. Predict the opponent's deck and hand mid-match.
Turn ${live.turn} of ${live.lastTurn}. Opponent hand size: ${live.oppHand}. Opponent cards seen: ${seen || "none yet"}.
Locations: ${live.locs.map((n, i) => n || "Location " + (i + 1)).join(", ")}. They snapped: ${live.oppSnap ? "yes" : "no"}.
Cards that often appeared with these in this player's past opponents: ${history || "no history"}.
Use real MARVEL SNAP card names. Reply with JSON only: {"archetype": "deck name", "deck": [{"name": card, "chance": 0-100}] (up to ${Math.max(4, 12 - live.opp.length)} cards they likely still have), "inHand": [{"name": card, "chance": 0-100, "why": "short"}] (up to 5), "watchOut": ["short warnings about plays to expect"], "tip": "one sentence of advice for this turn"}`;
      const r = await store.sample.json(prompt, { modelTier: "default" });
      live.pred = { archetype: String(r.archetype || ""), deck: arr(r.deck).slice(0, 12), inHand: arr(r.inHand).slice(0, 5), watchOut: arr(r.watchOut).map(String).slice(0, 4), tip: String(r.tip || "") };
    }
  } catch (e) { live.pred = predictLocal(); toast(e && e.code === "rate_limited" ? "AI is busy, so this guess uses your history." : "AI wasn't available, so this guess uses your history."); }
  live.predBusy = false; saveLive(); render();
}

function applySnapVault() {

document.addEventListener("input", (e) => {
  const t = e.target, d = t.dataset;
  if (d.bind) {
    setPath(S, d.bind, d.num ? (t.value === "" ? "" : num(t.value)) : t.value); save();
    if (d.bind.startsWith("me.")) $("#mechip").innerHTML = `${avatarHtml(S.me.avatar, S.me.handle || "?", store.uid || "me")}<span class="h">${esc(S.me.handle || "Set up profile")}</span>`;
    if (d.bind.startsWith("wallet.")) { const box = $("#shop-alerts"); if (box) box.innerHTML = shopAlertsHtml(); }
    if (d.bind === "me.rank" || d.bind === "me.peak") { const cs = currentSeason(); if (cs) { const r = (S.ranks["s:" + cs.id] = obj(S.ranks["s:" + cs.id])); r[d.bind === "me.rank" ? "end" : "peak"] = t.value; } }
    return;
  }
  if (d.rpnote) { rp.note = t.value; return; }
  if (d.mc) { mc.text = t.value; return; }
  if (d.ui) { ui[d.ui] = t.value; render(); return; }
  if (d.live) { if (d.live.startsWith("loc")) { live.locs[num(d.live.slice(3))] = t.value; showLocInfo(t); } else live[d.live] = t.value; saveLive(); return; }
  if (d.livewp) { live.sig.winPct = t.value; saveLive(); return; }
  if (d.pick) { picker.q = t.value; refreshSheet(); return; }
  if (d.mf) { mf[d.mf] = d.mf === "ts" ? (new Date(t.value).getTime() || mf.ts) : d.mf === "turn" ? num(t.value, 6) : t.value; return; }
  if (d.mfloc) { mf.locs[num(d.i)][d.mfloc] = t.value; return; }
  if (d.deck) { const dk = deckEdit(); if (dk) { dk[d.deck] = t.value; save(); } return; }
  if (d.ai) { ai[d.ai] = t.value; return; }
  if (d.imp) { imp.text = t.value; return; }

/* ============ More features: insights, albums, planner, splits, deck versions, synergy, deck links,
   quick log, the alliance week, tournaments, community card stats and screenshot reading ============ */
const pad2 = (n) => String(n).padStart(2, "0");
const MODES = ["Ranked", "Conquest", "Friendly", "Draft", "High Voltage", "Deadpool's Diner", "Sanctum Showdown", "Event", "Limited-time mode", "Other"];
const modeOf = (m) => (m && m.mode) || "Ranked";
const APP_URL = window.SNAPSTAT_STANDALONE ? location.origin + location.pathname : "https://rhaddaddy.github.io/snap-stat/";
function progBar(have, of, label) { return `<div class="bar" role="img" aria-label="${esc(label || `${have} of ${of}`)}"><i style="width:${clamp(pct(have, of), 0, 100)}%"></i></div>`; }
const avgCubes = (list) => (list.length ? Math.round((list.reduce((s, m) => s + num(m.cubes), 0) / list.length) * 10) / 10 : 0);
const winPct = (list) => pct(list.filter((m) => m.result === "W").length, list.filter((m) => m.result !== "T").length);

/* ============ Rank climb ============ */
const CPR = 10; // cubes per rank; Infinite is rank 100
function seasonAt(ts) { return seasons().find((s) => ts >= s.startTs && ts <= s.endTs) || null; }
function rankFromStr(r) { const s = String(r || "").trim(); if (/^inf/i.test(s)) return 100; const n = parseInt(s, 10); return n >= 1 && n <= 100 ? n : 0; }
const rankStr = (r) => (r >= 100 ? "Infinite" : String(r));
// The game drops you about 30 ranks, to a multiple of 10, when a new season starts.
const seasonReset = (r) => (r >= 100 ? 70 : Math.max(1, Math.floor((r - 30) / 10) * 10));
function climbNow() {
  const c = obj(S.climb); if (!c.at) return null;
  let total = clamp(num(c.rank), 1, 100) * CPR + clamp(num(c.cubes), 0, CPR - 1);
  let peak = total, games = 0, floor10 = total >= 10 * CPR;
  const base = seasonAt(c.at), endTs = base ? base.endTs : Infinity;
  const ms = realMatches().filter((m) => m.ts > c.at && m.ts <= endTs && modeOf(m) === "Ranked").sort((a, b) => a.ts - b.ts);
  for (const m of ms) {
    if (total >= 100 * CPR) break;
    total = Math.min(100 * CPR, Math.max(floor10 ? 10 * CPR : CPR, total + num(m.cubes)));
    if (total >= 10 * CPR) floor10 = true;
    peak = Math.max(peak, total); games++;

  const cur = currentSeason();
  const stale = !!(cur && ((base && cur.id !== base.id) || (!base && c.at < cur.startTs)));
  const rank = Math.floor(total / CPR);
  return { rank, cubes: rank >= 100 ? 0 : total % CPR, inf: rank >= 100, peak: Math.floor(peak / CPR), games, stale };
}
function syncRankFromClimb() {
  const st = climbNow(); if (!st || st.stale) return false;
  const r = rankStr(st.rank), pk = rankStr(Math.max(rankFromStr(S.me.peak), st.peak));
  if (S.me.rank === r && S.me.peak === pk) return false;
  S.me.rank = r; S.me.peak = pk;
  const cs = currentSeason(); if (cs) { const rr = (S.ranks["s:" + cs.id] = obj(S.ranks["s:" + cs.id])); rr.end = r; rr.peak = pk; }
  return true;
}
function onMatchSaved(m) { const a = syncRankFromClimb(), b = afterMatchChecks(m); if (a || b) save(); }
/* One-tap save from Quick log (and voice logging). */
function quickSaveMatch(r, c, extra = {}) {
  const q = obj(S.quick); const last = realMatches()[0];
  const deckId = q.deckId !== undefined ? q.deckId : last ? last.deckId || "" : ""; const mode = q.mode || (last ? modeOf(last) : "Ranked");
  const d = S.decks.find((x) => x.id === deckId);
  const m = { id: uid(), ts: Date.now(), result: r, cubes: r === "W" ? c : r === "L" ? -c : 0, mode, deckId: d ? d.id : "", deckName: d ? d.name : "", oppName: "", oppCards: [], snapped: !!qk.f.snapped, oppSnapped: !!qk.f.oppSnapped, retreated: !!qk.f.retreated, oppRetreated: !!qk.f.oppRetreated, turn: 6, bot: "unsure", notes: "", quick: true, ...extra };
  putMatch(m); S.quick = { ...q, deckId: m.deckId, mode }; syncRankFromClimb(); afterMatchChecks(m); save(); qk.last = m; qk.f = {}; refreshSheet(); render();
  toast(`${r === "W" ? "Win" : r === "L" ? "Loss" : "Tie"} saved${c ? ` (${signed(m.cubes)})` : ""}`);
  return m;
}
function climbPace() {
  const ranked = realMatches().filter((m) => modeOf(m) === "Ranked");
  const recent = ranked.slice(0, 50);
  const last14 = ranked.filter((m) => m.ts >= Date.now() - 14 * DAY);
  const span = last14.length ? Math.max(1, Math.min(14, (Date.now() - Math.min(...last14.map((m) => m.ts))) / DAY)) : 0;
  return { cpg: recent.length ? recent.reduce((s, m) => s + num(m.cubes), 0) / recent.length : 0, gpd: span ? last14.length / span : 0, n: recent.length };
}
function climbForm(st) {
  const r = st ? st.rank : rankFromStr(S.me.rank) || "", c = st ? st.cubes : "";
  return `<div class="panel stack"><p class="small">Enter your rank from the game. Ranked matches you log after this move it up and down by their cubes, so your rank stays current here and on your profile.</p>
    <div class="grid2"><label class="f">Rank now (1–100)<input type="number" id="cl-rank" min="1" max="100" inputmode="numeric" value="${esc(r)}"></label><label class="f">Cubes into this rank (0–9)<input type="number" id="cl-cubes" min="0" max="9" inputmode="numeric" value="${esc(c)}"></label></div>
    <div class="row"><button class="btn snap" data-a="climbSave">Save rank</button>${st ? `<button class="btn ghost" data-a="climbCancel">Cancel</button>` : ""}</div>
    <p class="muted small">10 cubes = 1 rank. Infinite is rank 100.</p></div>`;
}
function climbPanel() {
  const st = climbNow();

  if (st.stale) {
    const sug = seasonReset(st.rank);
    return `<div class="panel stack"><b>A new season started</b><p class="small">Last season you reached rank ${esc(rankStr(st.rank))}. The game usually drops you about 30 ranks, so you'd start this season around rank ${sug}.</p>
      <div class="row"><button class="btn snap" data-a="climbReset" data-v="${sug}">Start at rank ${sug}</button><button class="btn" data-a="climbEdit">Enter my rank</button></div></div>`;
  }
  const cs = currentSeason();
  if (st.inf) return `<div class="panel stack halftone"><div class="row between"><b style="font-size:20px">Infinite</b>${rankBadge("Infinite")}</div><p class="small">You made it to the top rank${cs ? " this season" : ""}. Nice climbing.</p><div><button class="btn sm ghost" data-a="climbEdit">Change rank</button></div></div>`;
  const need = (100 - st.rank) * CPR - st.cubes; const pace = climbPace();
  const cpg = Math.round(pace.cpg * 100) / 100, games = cpg > 0 ? Math.ceil(need / cpg) : 0;

    <div><button class="btn sm ghost" data-a="climbEdit">Fix rank</button></div></div>`;
}

/* ============ Snap & retreat coach ============ */
function coachHtml(ms) {
  const g = ms.filter((m) => ["W", "L", "T"].includes(m.result));
  if (g.length < 8) return `<p class="muted small">Log at least 8 matches${g.length ? ` (${g.length} so far)` : ""} to get snap and retreat tips.</p>`;
  const sn = g.filter((m) => m.snapped), ns = g.filter((m) => !m.snapped);
  const ret = g.filter((m) => m.retreated), full = g.filter((m) => m.result === "L" && !m.retreated);
  const os = g.filter((m) => m.oppSnapped), osStay = os.filter((m) => !m.retreated), osRet = os.filter((m) => m.retreated);
  const wins = g.filter((m) => m.result === "W"); const snapRate = pct(sn.length, g.length);
  const tips = [];
  if (sn.length >= 3 && winPct(sn) >= 60 && snapRate < 30) tips.push(`You win ${winPct(sn)}% of the games you snap, but you only snap in ${snapRate}% of them. Snapping more when you're ahead earns more cubes.`);
  if (sn.length >= 5 && winPct(sn) < 45) tips.push(`You win just ${winPct(sn)}% of the games you snap. Try snapping a turn later, once you've seen more of their cards.`);
  if (full.length >= 4 && avgCubes(full) <= -3) tips.push(`Losses you play to the end cost ${-avgCubes(full)} cubes each on average. Retreat sooner when you can't win two locations.`);
  if (osStay.length >= 3 && winPct(osStay) < 45) tips.push(`When they snap and you stay in, you win ${winPct(osStay)}% and average ${signed(avgCubes(osStay))} cubes. Retreating more often after their snap would save cubes.`);
  if (osStay.length >= 3 && winPct(osStay) >= 60) tips.push(`You win ${winPct(osStay)}% of games where they snap and you stay. Their snap is often a bluff against you.`);
  if (wins.length >= 5 && avgCubes(wins) < 2.5) tips.push(`Your wins average only ${signed(avgCubes(wins))} cubes. Snapping when you're confident doubles what a win is worth.`);
  if (ret.length >= 5 && full.length * 3 < ret.length && pct(ret.length, g.length) > 35) tips.push(`You retreat from ${pct(ret.length, g.length)}% of games. Playing out a few more close ones could turn some into wins.`);
  const timed = sn.filter((m) => num(m.snapTurn) > 0);
  const buckets = [["Turns 1–3", (t) => t <= 3], ["Turns 4–5", (t) => t >= 4 && t <= 5], ["Turn 6+", (t) => t >= 6]].map(([l, f]) => { const list = timed.filter((m) => f(num(m.snapTurn))); return { l, list }; }).filter((b) => b.list.length);
  const early = buckets.find((b) => b.l === "Turns 1–3"), late = buckets.find((b) => b.l === "Turn 6+");
  if (early && late && early.list.length >= 3 && late.list.length >= 3 && winPct(early.list) + 15 < winPct(late.list)) tips.push(`Your early snaps win ${winPct(early.list)}%, your turn 6 snaps ${winPct(late.list)}%. Waiting a bit pays off for you.`);
  if (!tips.length) tips.push("Your snapping and retreating look balanced. Keep logging matches to spot patterns.");
  const tile = (k, v, cls = "") => `<div class="tile"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
  return `<div class="tiles">${tile("You snap", snapRate + "%")}${tile("Win % when you snap", sn.length ? winPct(sn) + "%" : "—")}${tile("Win % when you don't", ns.length ? winPct(ns) + "%" : "—")}
    ${tile("Avg cubes when you snap", sn.length ? signed(avgCubes(sn)) : "—")}${tile("Avg cost of a retreat", ret.length ? signed(avgCubes(ret)) : "—")}${tile("Avg cost of a full loss", full.length ? signed(avgCubes(full)) : "—")}
    ${tile("Win % when they snap", os.length ? winPct(os) + "%" : "—")}${tile("You retreat after their snap", os.length ? pct(osRet.length, os.length) + "%" : "—")}</div>
    <div class="panel stack"><span class="eyebrow">Tips from your games</span><ul class="tips">${tips.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>
    ${buckets.length ? `<div class="tbl-wrap"><table><thead><tr><th>You snapped on</th><th class="n">Games</th><th class="n">Win %</th><th class="n">Avg cubes</th></tr></thead><tbody>${buckets.map((b) => `<tr><td>${b.l}</td><td class="n">${b.list.length}</td><td class="n">${winPct(b.list)}%</td><td class="n">${signed(avgCubes(b.list))}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">Tick “You snapped” in the live tracker when you snap and the app also learns which turn works best for you.</p>`}`;
}

/* ============ Matchups ============ */
const ARCH_NAMES = { D: "Destroy", X: "Discard", M: "Move", O: "Ongoing", B: "Buff", P: "Ramp", C: "Disrupt", S: "Card generation", J: "Gives you cards", L: "Location" };

function archetypeOf(names) {

  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  if (top && top[1] >= 2) return ARCH_NAMES[top[0]];

  const ctab = (rows) => `<div class="tbl-wrap"><table><thead><tr><th>Their card</th><th class="n">Games</th><th class="n">Win %</th><th class="n">Cubes</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${esc(r.n)}</td><td class="n">${r.l.length}</td><td class="n ${r.wr >= 50 ? "pos" : "neg"}">${r.wr}%</td><td class="n">${signed(r.l.reduce((s, m) => s + num(m.cubes), 0))}</td></tr>`).join("")}</tbody></table></div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Their deck type</th><th class="n">Games</th><th class="n">W-L</th><th class="n">Win %</th><th class="n">Cubes</th></tr></thead><tbody>${arch.map(({ a, list }) => { const s = statsFor(list); return `<tr><td>${esc(a)}</td><td class="n">${s.games}</td><td class="n">${s.w}-${s.l}</td><td class="n">${s.wr}%</td><td class="n ${s.cubes >= 0 ? "pos" : "neg"}">${signed(s.cubes)}</td></tr>`; }).join("")}</tbody></table></div>
    <p class="muted small">Deck type is a guess from the effects of the cards they showed.</p>
    ${worst.length ? `<h3>Cards that beat you</h3>${ctab(worst)}` : crow.length ? "" : `<p class="muted small">Once you've seen a card in 3 or more games, you'll see how you do against it.</p>`}
    ${best.length ? `<h3>Cards you beat</h3>${ctab(best)}` : ""}`;
}
function modesHtml(ms) {

  const rows = Object.entries(by).sort((a, b) => b[1].length - a[1].length);

  return `<div class="tbl-wrap"><table><thead><tr><th>Mode</th><th class="n">Games</th><th class="n">W-L-T</th><th class="n">Win %</th><th class="n">Cubes</th></tr></thead><tbody>${rows.map(([mo, list]) => { const s = statsFor(list); const hasCubes = list.some((m) => num(m.cubes)); return `<tr><td>${esc(mo)}</td><td class="n">${s.games}</td><td class="n">${s.w}-${s.l}-${s.t}</td><td class="n">${s.wr}%</td><td class="n ${s.cubes >= 0 ? "pos" : "neg"}">${hasCubes ? signed(s.cubes) : "—"}</td></tr>`; }).join("")}</tbody></table></div>`;

function syncDeckVersions() {

    // While you're editing (no games played with the newest version yet, and it's under 15 minutes old) the newest version just updates.
    if (now - num(last.ts) < 15 * 60e3 && !deckMatches(d).some((m) => m.ts >= num(last.ts))) { last.cards = [...d.cards]; continue; }

}

/* ---------- Snap Pack helper (Card Shop) ---------- */
let PACKS = null, packVer = 0; const PACK_CACHE = "snapstat.packs";
function usePacks(j, fromCache) {

  refreshView(); return true;
}
async function loadPacks() {
  if (!window.SNAPSTAT_STANDALONE) return;
  try { const c = localStorage.getItem(PACK_CACHE); if (c) usePacks(JSON.parse(c), true); } catch { /* no saved copy */ }
  for (const u of catUrls("packs.json")) {
    try {
      const r = await fetch(u, { cache: "no-cache" }); if (!r.ok) continue;
      const text = await r.text(); const j = JSON.parse(text);
      if (PACKS && j.updated && j.updated === PACKS.updated) return;
      if (!usePacks(j, false)) continue;
      try { localStorage.setItem(PACK_CACHE, text); } catch { /* fetched again next time */ }
      return;
    } catch { /* try the next copy */ }
  }
}

    keys: allCards().filter((c) => !c.upcoming && !c.custom && !c.catModeOnly && seriesOf(c) === "Series " + sr && !inSeasonal.has(c.key)).map((c) => c.key) }));
  const map = sfVarMap(); const byCat = new Map(allVariants().filter((v) => v.cat).map((v) => [v.cat, v]));
  const special = PACKS.packs.filter((p) => p.kind === "special" && (!p.end || p.end >= today)).map((p) => ({ ...p, id: p.slug, vars: arr(p.variants).map((vid) => { const cv = map.get(vid); return { vid, v: cv ? byCat.get(cv.cat) : null }; }) }));

async function fetchSfLink(link) {

  }
}
async function checkSfLink(manual) {

  sfl.busy = true; if (manual) { sfl.msg = "Checking…"; requestRender(); }
  try {
    const text = await fetchSfLink(link); sfl.raw = text.slice(0, 20000);
    let j; try { j = JSON.parse(text); } catch { throw new Error("The link didn't return data the app can read. Copy what it shows and send it to Claude to connect it."); }
    const list = findMatchArray(j); if (!list) throw new Error("No matches found in what the link returned. Play a game, or copy what it shows and send it to Claude.");

    for (const o of list.slice(0, 200)) {
      const m = mapSfMatch(o); if (!m.result || !m.ts) continue; const key = "sf-" + (m.id || m.ts); if (seen.has(key) || findMatch(key)) continue;
      const sig = [...m.deckCards].sort().join(","); const d = m.deckCards.length >= 10 ? S.decks.find((x) => [...x.cards].sort().join(",") === sig) || S.decks.find((x) => m.deckCards.filter((k) => x.cards.includes(k)).length >= 10) : null;
      const match = { id: key, ts: m.ts, result: m.result, cubes: m.cubes, mode: m.mode, deckId: d ? d.id : "", deckName: d ? d.name : "", oppName: m.oppName, oppCards: m.oppCards, snapped: m.snapped, oppSnapped: m.oppSnapped, retreated: m.retreated, oppRetreated: m.oppRetreated, turn: 6, bot: "unsure", notes: "", locs: m.locs.filter((l) => l.name), tracked: m.locs.filter((l) => l.name).length === 3, sf: true };
      putMatch(match); seen.add(key); added++;
    }
    S.sfSeen = [...seen].slice(-600); S.sfChecked = Date.now(); if (added) { onMatchSaved(); S.sfAdded = num(S.sfAdded) + added; } save();
    sfl.msg = added ? `Added ${plural(added, "new match", "new matches")}.` : "No new matches."; if (added) toast(`snap.fan: ${plural(added, "new match", "new matches")} logged`);
  } catch (e) { sfl.msg = e && e.message ? e.message : "Couldn't check the link."; }
  sfl.busy = false; requestRender();
}

function fbErrText(e) {
  const c = (e && e.code) || "";
  if (c.includes("popup-closed") || c.includes("cancelled-popup")) return "";
  if (c.includes("popup-blocked")) return "Your browser blocked the sign-in window. Allow pop-ups for this site and try again.";
  if (c.includes("unauthorized-domain")) return "This web address isn't allowed to sign in yet. In Firebase, add it under Authentication › Settings › Authorized domains.";
  if (c.includes("operation-not-allowed")) return "This sign-in method isn't turned on yet. In Firebase, turn it on under Authentication › Sign-in method.";
  if (c.includes("network")) return "Couldn't reach Google. Check your connection and try again.";
  if (c.includes("web-storage") || c.includes("internal")) return "Sign-in didn't finish. If you opened this link inside another app, open it in Safari or Chrome instead.";

}

async function initFirebase(local, lm) {
  store.provider = "firebase";
  store.downloads = { save: ({ filename, data }) => { const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: "application/json" })); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return Promise.resolve({ status: "saved" }); } };

    store.ready = true; render();
    if (api === null && window.snapFirebaseNeedsConfig) openSheet(setupSheet);

    return;
  }
  store.fb = api;
  if (window.__overlay) { store.ready = true; startOverlay(window.__overlay === "me" ? "" : window.__overlay, api); return; }

    if (user) {
      if (started && store.uid === user.uid) return;
      store.user = { uid: user.uid, name: user.displayName || "", email: user.email || "" };
      store.db = api.db; store.uid = user.uid; store.mode = "cloud"; started = true;

      store.mode = "local"; store.ready = true; render();
