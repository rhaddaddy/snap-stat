# Once a day (and right away whenever this file or a script changes) this refreshes:
#   card-data.json        card art, details, every variant and location (Marvel Snap Zone)
#   schedule.json         seasons, limited-time events, bundles and event shops (snap.fan)
#   balance-history.json  every cost, power and ability change (snap.fan)
#   variant-details.json  each variant's name, artists, rarity, source and release date (snap.fan)
name: Update card data

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-cards.yml"
      - "scripts/update-cards.mjs"
      - "scripts/update-schedule.mjs"
      - "scripts/update-history.mjs"
      - "scripts/update-variants.mjs"

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download cards, variants and locations
        run: node scripts/update-cards.mjs
      - name: Download seasons, events and shops
        run: node scripts/update-schedule.mjs
        continue-on-error: true
      - name: Download balance history
        run: node scripts/update-history.mjs
        continue-on-error: true
      - name: Download variant details
        run: node scripts/update-variants.mjs
        continue-on-error: true
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add card-data.json card-data-sample.json
          for f in schedule.json balance-history.json variant-details.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update card data"
            git pull --rebase
            git push
          fi
