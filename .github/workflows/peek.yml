# Temporary (round 3): saves copies of a few public pages so their formats can be checked. Safe to delete.
name: Peek at data sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/peek.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p debug
          UA="Mozilla/5.0 (compatible; SNAP-Stat-card-updater/1.0)"
          get() { curl -sSL -A "$UA" --max-time 60 -o "debug/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 failed"; }
          get sf-bundles.html "https://snap.fan/bundles/"
          get sf-decks.html "https://snap.fan/decks/"
          get sf-tierlist.html "https://snap.fan/decks/tier-list/"
          get sf-meta.html "https://snap.fan/meta/"
          get sf-balance.html "https://snap.fan/cards/balance-history/"
          get sf-balance2.html "https://snap.fan/balance-history/"
          get sf-event-ca.html "https://snap.fan/events/ChampionArena_Oct26/"
          get sf-event-sanctum.html "https://snap.fan/events/LocationWar_Nov26/"
          get sf-home.html "https://snap.fan/"
          # Can the app draw this art onto a picture? (needs an Access-Control-Allow-Origin header)
          curl -sSI -A "$UA" -H "Origin: https://rhaddaddy.github.io" "https://marvelsnapzone.com/wp-content/themes/blocksy-child/assets/media/cards/abomination.webp?v=1161" > debug/cors-msz.txt || true
          curl -sSI -A "$UA" -H "Origin: https://rhaddaddy.github.io" "https://game-assets.snap.fan/card_variant_images/SuperiorIronMan-f87821f522ced6f3b284373f70962170f84a1740995303a73b4f7efc482e9d4e.webp" > debug/cors-sf.txt || true
          curl -sSI -A "$UA" -H "Origin: https://rhaddaddy.github.io" -H "Referer: https://rhaddaddy.github.io/" "https://marvelsnapzone.com/wp-content/themes/blocksy-child/assets/media/cards/abomination.webp?v=1161" > debug/hotlink-msz.txt || true
          ls -la debug
          for f in debug/*.html; do head -c 600000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add debug
          git diff --cached --quiet || (git commit -m "Peek at data sources" && git pull --rebase && git push)
