name: Probe (one-off)
on: { workflow_dispatch: {}, push: { paths: [".github/workflows/probe.yml", "scripts/probe_web.js"] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: mkdir -p probe && node scripts/probe_web.js || true
      - run: |
          cd probe && git init -q && git checkout -q -b probe-results && git add -A && git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm results
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
