# Temporary (round 5): saves copies of a few public pages so their formats can be checked. Safe to delete.
name: Peek at data sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/peek.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p debug
          UA="Mozilla/5.0 (compatible; SNAP-Stat-card-updater/1.0)"
          get() { curl -sSL -A "$UA" --max-time 60 -o "debug/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 failed"; }
          get sf-variants.html "https://snap.fan/cards/variants/"
          get sf-variants-amazing.html "https://snap.fan/cards/variants/?quality=Amazing"
          get sf-variant-categories.html "https://snap.fan/cards/variant-categories/"
          get sf-card-ghostrider.html "https://snap.fan/cards/GhostRider/"
          get sf-variant-gr18.html "https://snap.fan/cards/GhostRider/GhostRider_18/"
          get sf-variant-blade23.html "https://snap.fan/cards/Blade/Blade_23/"
          get sf-artists.html "https://snap.fan/artists/"
          ls -la debug
          for f in debug/*.html; do head -c 700000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add debug
          git diff --cached --quiet || (git commit -m "Peek at data sources" && git pull --rebase && git push)
