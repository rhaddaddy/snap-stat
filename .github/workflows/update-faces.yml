# Finds where each card's face is in its art (faces.json), for profile pictures and deck icons. Only new art is done each day.
name: Update faces
on:
  schedule:
    - cron: "41 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update-faces.py", ".github/workflows/update-faces.yml"]
permissions:
  contents: write
concurrency:
  group: faces
  cancel-in-progress: false
jobs:
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Start from the newest results (another run may have just saved some)
        run: git pull -q --rebase origin main || true
      - name: Match the game's face portraits against the art
        run: pip install --quiet pillow numpy opencv-python-headless && FACE_BUDGET_MIN=45 python3 scripts/update-faces.py match
      - name: Look for heads where the portrait was drawn separately
        run: pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --quiet transformers timm && FACE_BUDGET_MIN=50 python3 scripts/update-faces.py dino
        continue-on-error: true
      - name: Save changes
        run: |
          git config user.email noreply@anthropic.com && git config user.name "SNAP Stat faces"
          git add faces.json faces-log.json
          git diff --cached --quiet && exit 0
          git commit -qm "Update faces"
          for n in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
