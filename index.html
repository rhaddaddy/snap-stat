/* ---------- Deck vs location ---------- */
function locHelpHurt(locs) {
  const pool = arr(locs).filter((r) => r.games >= 2 && r.lw + r.ll > 0);
  if (pool.length < 2) return "";
  const by = (r) => r.lwr * 1000 + r.wr * 10 + r.games;
  const help = [...pool].sort((a, b) => by(b) - by(a)).slice(0, 3).filter((r) => r.lwr >= 50);
  const hurt = [...pool].sort((a, b) => by(a) - by(b)).slice(0, 3).filter((r) => r.lwr < 50 && !help.includes(r));
  const chip = (r, good) => `<button class="lchip ${good ? "good" : "bad"}" data-a="locOpen" data-name="${esc(r.name)}"><b>${esc(r.name)}</b><span>won it ${r.lwr}% · ${r.games} games</span></button>`;
  return `<div class="stack small" style="gap:6px">${help.length ? `<span class="eyebrow">Locations that help this deck</span><div class="chips">${help.map((r) => chip(r, true)).join("")}</div>` : ""}
    ${hurt.length ? `<span class="eyebrow">Locations that hurt it</span><div class="chips">${hurt.map((r) => chip(r, false)).join("")}</div>` : ""}</div>`;
}
function locDecksHtml(name) {
  const k = keyOf(name), by = {};
  for (const m of realMatches()) {
    if (!m.tracked) continue;
    const L = arr(m.locs).find((x) => keyOf(obj(x).name) === k); if (!L) continue;
    const id = m.deckId || m.deckName; if (!id) continue;
    const r = (by[id] = by[id] || { name: m.deckName || "No deck", games: 0, mw: 0, ml: 0, lw: 0, ll: 0 });
    r.games++; if (m.result === "W") r.mw++; else if (m.result === "L") r.ml++;
    if (num(L.my) > num(L.opp)) r.lw++; else if (num(L.my) < num(L.opp)) r.ll++;

  if (!rows.length) return "";
  return `<h3>Your decks here</h3><div class="list">${rows.map((r) => `<div class="li"><div class="grow"><div class="t">${esc(r.name)}</div><div class="s">${r.games} game${r.games === 1 ? "" : "s"} · ${pct(r.mw, r.mw + r.ml)}% match wins</div></div><span class="num ${pct(r.lw, r.lw + r.ll) >= 50 ? "pos" : "neg"}" style="font-weight:800">won it ${pct(r.lw, r.lw + r.ll)}%</span></div>`).join("")}</div>`;
}

const VG_KINDS = { artist: "Artist", rarity: "Rarity", source: "Where they come from" };
function vgArtists(v) { return String(v.artist || "").split(/\s*(?:&|,| and )\s*/).map((s) => s.trim()).filter((s) => s.length > 1); }

/* ---------- The automatic bot check ---------- */
// After a match: the tracker's timing (how quickly the opponent answered each turn), what the end screen showed,
// and whether you've played this name before. A likely bot sends a notification.
function autoBot(m, meta, mm) {
  const why = []; let s = 50;
  const b = obj(obj(meta).bot);
  if (num(b.fast) >= 3 && num(b.slow) === 0) { s += 25; why.push(`answered all ${b.fast} turns you played quickly within ${b.maxWait || 3}s`); }
  else if (num(b.slow) >= 1) { s -= 20; why.push(`took a while on ${b.slow} turn${b.slow === 1 ? "" : "s"}`); }
  if (mm && mm.oppSnapped) { s -= 15; why.push("snapped"); }
  if (mm && mm.oppRetreated && num(m.turn) <= 4) { s -= 5; }
  const name = keyOf(m.oppName || "");
  if (name) { const seen = realMatches().filter((x) => x.id !== m.id && keyOf(x.oppName || "") === name).length; if (seen >= 2) { s -= 10; why.push(`you've played them ${seen} times before`); } }
  if (num(b.emotes) > 0) { s -= 30; why.push("emoted"); }
  return { score: clamp(s, 0, 100), why };
}
function applyAutoBot(m, meta, mm) {
  const r = autoBot(m, meta, mm); if (!r.why.length) return null;
  m.botAuto = r.score; m.botWhy = r.why.slice(0, 4).join(", "); m.bot = botLabel(r.score);
  if (botLabel(r.score) === "likely" && !obj(obj(meta).bot).told) notifyNow("That was probably a bot", `${m.oppName ? m.oppName + " " : "Your opponent "}${m.botWhy}.`, "bot:" + m.id, "#home/matches");
  return r;
}

/* ---------- Which of your decks helps with a mission or bounty ---------- */
// Each mission's words become a test: how many cards in a deck do what it asks.

function missionTest(text) {
  const t = String(text || "").toLowerCase().replace(/^hard\s*:\s*/, "");
  let m;
  if ((m = t.match(/play (\d+)-cost/))) { const n = Number(m[1]); return { what: `${n}-cost cards`, count: (cs) => cs.filter((c) => num(c.cost) === n).length, need: 3 }; }
  if ((m = t.match(/win a location with (\d+) or (?:less|fewer) power/))) { const n = Number(m[1]); return { what: "low-Power cards", count: (cs) => cs.filter((c) => c.power !== "?" && num(c.power) <= Math.max(2, Math.floor(n / 3))).length, need: 4 }; }
  if ((m = t.match(/win a location with (\d+) cards/))) return { what: "cheap cards to fill a location", count: (cs) => cs.filter((c) => num(c.cost) <= 2).length, need: 5 };
  if (/power'?s? worth|play .*power/.test(t)) return { what: "high-Power cards", count: (cs) => Math.round(cs.reduce((s, c) => s + Math.max(0, num(c.power)), 0) / 6), need: 8 };
  if (/destroy/.test(t)) return { what: "Destroy cards", count: (cs) => cs.filter((c) => hasTag(c, "D") || /destroy/.test(abil(c))).length, need: 3 };
  if (/discard/.test(t)) return { what: "Discard cards", count: (cs) => cs.filter((c) => hasTag(c, "X") || /discard/.test(abil(c))).length, need: 3 };
  if (/\bmove/.test(t)) return { what: "Move cards", count: (cs) => cs.filter((c) => hasTag(c, "M") || /\bmove/.test(abil(c))).length, need: 3 };
  if (/on reveal/.test(t)) return { what: "On Reveal cards", count: (cs) => cs.filter((c) => hasTag(c, "R") || /on reveal/.test(abil(c))).length, need: 5 };
  if (/ongoing/.test(t)) return { what: "Ongoing cards", count: (cs) => cs.filter((c) => hasTag(c, "O") || /ongoing/.test(abil(c))).length, need: 4 };
  if (/draw/.test(t)) return { what: "cards that draw", count: (cs) => cs.filter((c) => /draw/.test(abil(c))).length + 2, need: 4 };
  if (/add .*(hand|cards)|create|generate/.test(t)) return { what: "cards that add cards", count: (cs) => cs.filter((c) => hasTag(c, "S") || hasTag(c, "J") || /add (a|an|\d|two|three)|to your hand/.test(abil(c))).length, need: 3 };
  if (/(afflict|-\d+ power|negative power|lower)/.test(t)) return { what: "cards that lower Power", count: (cs) => cs.filter((c) => /-\d+ power|afflict/.test(abil(c))).length, need: 3 };
  if (/(buff|increase|\+\d+ power|gain power)/.test(t)) return { what: "cards that add Power", count: (cs) => cs.filter((c) => hasTag(c, "B") || /\+\d+ power/.test(abil(c))).length, need: 4 };
  if ((m = t.match(/spend (\d+) energy/))) return { what: "a full curve", count: (cs) => Math.round(cs.reduce((s, c) => s + num(c.cost), 0) / 4), need: 8 };
  if (/win (matches|games)|win \d+ (matches|games)/.test(t)) return { what: "wins", rate: true, need: 1 };

}
// How much each deck helps with these tasks (unfinished ones only); the best few come back with what helps
function bestDecksFor(tasks, limit = 3) {
  const decks = S.decks.filter((d) => d.status === "active" && arr(d.cards).length >= 6);
  const tests = tasks.filter((x) => x && !x.done).map((x) => ({ x, t: missionTest(x.text) })).filter((y) => y.t);
  if (!decks.length || !tests.length) return [];
  return decks.map((d) => {
    const cs = arr(d.cards).map(card); let score = 0; const helps = [];
    const st = statsFor(deckMatches(d)), wr = st.games >= 3 ? st.wr / 100 : 0.5;
    for (const { x, t } of tests) {

      score += fit * w;

      if (t.rate && st.games >= 3 && wr >= 0.55) helps.push(`${x.text} (wins ${st.wr}%)`);

/* ---------- Season pass pace ---------- */
const PASS_XP = 1000; // points per level, as the game shows (368/1,000)
function notePass(sid, level, xp, xpNext, time) {
  if (!sid || !(level > 0)) return;
  const L = (S.passLog = obj(S.passLog)), log = arr(L[sid]);
  const per = xpNext > 0 ? xpNext : PASS_XP, total = (level - 1) * per + Math.max(0, num(xp));
  const last = log[log.length - 1];
  if (last && last.total === total) return;
  if (last && time - last.t < 30 * 60e3) log.pop();  // one point per half hour is plenty
  log.push({ t: time || Date.now(), total, level }); L[sid] = log.slice(-60);
}
function passPace(s) {
  const p = obj(S.passes[s.id]), log = arr(obj(S.passLog)[s.id]); if (!num(p.level)) return null;
  const per = num(p.xpNext) || PASS_XP, now = Date.now(), daysLeft = Math.max(0, (s.endTs - now) / DAY);
  const total = (num(p.level) - 1) * per + num(p.xp);
  const first = log.find((e) => now - e.t < 21 * DAY) || log[0];
  const days = first ? (now - first.t) / DAY : 0;
  const perDay = first && days >= 0.75 && total > first.total ? (total - first.total) / days : 0;
  const of = num(s.passLevels) || 50, goalLevel = num(p.level) < of ? of : of + (p.tier === "plus" ? 10 : 0);
  const needXp = Math.max(0, (goalLevel - 1) * per - total);
  return { level: num(p.level), perDay: Math.round(perDay), endLevel: perDay ? Math.floor((total + perDay * daysLeft) / per) + 1 : 0, daysLeft, goalLevel, needPerDay: daysLeft > 0 ? Math.ceil(needXp / Math.max(0.5, daysLeft)) : 0, needXp, done: num(p.level) >= goalLevel };
}

  const r = passPace(s); if (!r) return "";
  const goal = r.goalLevel > (num(s.passLevels) || 50) ? `bonus level ${r.goalLevel}` : `level ${r.goalLevel}`;
  return `<span class="small">${r.done ? `You've reached ${esc(goal)}. Bonus levels keep giving rewards.` : `${esc(goal[0].toUpperCase() + goal.slice(1))} needs about <b>${fmt(r.needPerDay)}</b> pass XP a day (${fmt(r.needXp)} to go).`}${r.perDay ? ` At your pace (${fmt(r.perDay)} a day) you'll reach level <b>${r.endLevel}</b> by the end.` : r.done ? "" : " Your pace shows once SNAP Stat has seen your pass on two different days."}</span>`;

/* ---------- Play-by-play: the tracker saves the board each time you end a turn ---------- */
// That picture shows every card you've played so far (this turn's too) and the opponent's cards revealed before it,
// so comparing one turn's picture with the next shows what each of you played, where, and the Power each location has.
const TURN_PROMPT = (roster, hint) => `This is a MARVEL SNAP match in progress, just after the player (at the bottom) ended turn ${String(hint).slice(5) || "?"}. Read the board.
Valid card names (name cost/power): ${roster}
Reply as JSON: {"turn": the turn number shown (3/6 is 3) or null, "energy": the energy left in the player's energy circle or null, "locations": [{"name": "location name, or empty if not revealed yet", "my": the player's Power here (bottom number), "opp": the opponent's Power here (top number), "myCards": [{"card": "card name, from its art", "power": its Power}], "oppCards": [{"card": "", "power": number}]}] (exactly three, left to right), "hand": ["card names in the player's hand"], "oppName": "the opponent's name at the top if shown", "snapped": true if the cube shows the stakes were raised}
List only cards you can see. Never guess.`;
function applyTurnShot(x, t, time, hint, meta) {
  const sess = String(obj(meta).session || ""), n = num(obj(meta).turn) || num(t.turn) || num(String(hint).slice(5));
  if (!sess || !n) { x.status = "A picture from a match, but not which one"; save(); return; }
  const L = (S.turnLog = obj(S.turnLog));
  for (const [k, v] of Object.entries(L)) if (Date.now() - num(obj(v).at) > 3 * DAY) delete L[k];
  const locs = arr(t.locations).slice(0, 3).map((l) => ({ name: String(obj(l).name || "").slice(0, 40), my: nIn(obj(l).my), opp: nIn(obj(l).opp), myCards: turnCards(obj(l).myCards), oppCards: turnCards(obj(l).oppCards) }));
  const e = (L[sess] = obj(L[sess])); e.at = time || Date.now(); e.turns = obj(e.turns);
  e.turns[n] = { locs, energy: nIn(t.energy), hand: arr(t.hand).map((h) => { const c = fuzzyCard(h); return c ? c.key : ""; }).filter(Boolean).slice(0, 10), at: time };
  if (t.oppName) e.oppName = String(t.oppName).slice(0, 40);
  x.status = `Turn ${n} of a match`; x.detail = locs.map((l) => `${l.name || "?"} ${l.my ?? "?"}–${l.opp ?? "?"}`).join(" · ");
  // A match already logged from an earlier end picture gets the new turn too
  const m = realMatches().find((mm) => mm.session === sess); if (m) { attachTurns(m, { session: sess }, null); putMatch(m); }
  save();
}
function turnCards(list) { return arr(list).map((c) => { const f = fuzzyCard(obj(c).card); return f ? { k: f.key, p: nIn(obj(c).power) } : null; }).filter(Boolean).slice(0, 8); }
// What appeared on one side between two boards: [{k, p, loc}]
function boardDiff(a, b, side) {
  const out = [];
  for (let i = 0; i < 3; i++) {
    const before = arr(obj(arr(a && a.locs)[i])[side]).map((c) => c.k), left = [...before];
    for (const c of arr(obj(arr(b.locs)[i])[side])) { const j = left.indexOf(c.k); if (j >= 0) left.splice(j, 1); else out.push({ ...c, loc: i }); }
  }
  return out;
}
function buildTurns(log, mm) {
  const shots = Object.entries(obj(obj(log).turns)).map(([n, s]) => ({ n: Number(n), ...s })).sort((a, b) => a.n - b.n);
  if (!shots.length) return [];
  // The end screen shows the last board, with the opponent's final cards
  const endLocs = mm ? arr(mm.locations).slice(0, 3).map((l) => ({ name: String(obj(l).name || ""), my: nIn(obj(l).my), opp: nIn(obj(l).opp), myCards: turnCards(obj(l).myCards), oppCards: turnCards(obj(l).oppCards) })) : [];
  const end = endLocs.some((l) => l.myCards.length || l.oppCards.length) ? { n: shots[shots.length - 1].n + 1, locs: endLocs, end: true } : null;
  const names = (i) => { for (const s of [...shots].reverse()) { const nm = obj(arr(s.locs)[i]).name; if (nm) return nm; } return obj(endLocs[i]).name || `Location ${i + 1}`; };
  const out = [];
  shots.forEach((s, i) => {
    const prev = shots[i - 1] || null, next = shots[i + 1] || end;
    const mine = boardDiff(prev, s, "myCards");             // yours this turn (you see your own cards as you place them)
    const theirs = next ? boardDiff(s, next, "oppCards") : []; // theirs this turn, seen once they're revealed
    const spent = mine.reduce((t, c) => t + (card(c.k).cost === "?" ? 0 : num(card(c.k).cost)), 0);
    const pb = next || s; // the Power once this turn's cards were revealed
    out.push({ n: s.n, mine, theirs, spent, left: s.energy, power: [0, 1, 2].map((j) => { const l = obj(arr(pb.locs)[j]); return { name: names(j), my: l.my, opp: l.opp }; }), gap: prev && s.n - prev.n > 1 ? prev.n + 1 : 0 });
  });
  // Cards of yours on the final board that no turn picture showed (the last turn's, if it wasn't saved)
  if (end) { const last = shots[shots.length - 1], extra = boardDiff(last, end, "myCards"); if (extra.length) out.push({ n: end.n, mine: extra, theirs: [], spent: extra.reduce((t, c) => t + (card(c.k).cost === "?" ? 0 : num(card(c.k).cost)), 0), left: null, power: [0, 1, 2].map((j) => ({ name: names(j), my: obj(end.locs[j]).my, opp: obj(end.locs[j]).opp })), gap: 0, final: true }); }
  return out.slice(0, 10);
}
function attachTurns(m, meta, mm) {
  const sess = String(obj(meta).session || ""); if (!sess) return;
  m.session = sess; if (obj(meta).vs) m.vs = String(meta.vs).slice(0, 60);
  const log = obj(S.turnLog)[sess]; if (!log) return;
  const t = buildTurns(log, mm || m.endBoard || null); if (t.length) m.turns = t;
  if (mm && arr(mm.locations).length) m.endBoard = { locations: arr(mm.locations).slice(0, 3) };
  if (!m.oppName && log.oppName) m.oppName = log.oppName;
}
function playByPlayHtml(m) {
  const turns = arr(m.turns); if (!turns.length) return "";
  const deck = S.decks.find((d) => d.id === m.deckId) || null;
  const chips = (list, mineSide) => list.map((c) => `<div class="stack" style="gap:2px;align-items:center;width:62px">${cardChip(c.k, { noOwn: true, pow: c.p ?? undefined, deck: mineSide ? deck : null, size: "xs" })}</div>`).join("");
  return `<div class="stack pbp" style="gap:8px"><span class="eyebrow">Play by play</span>${turns.map((t) => {
      const at = (list) => [0, 1, 2].map((j) => list.filter((c) => c.loc === j)).map((cs, j) => (cs.length ? `<div class="stack" style="gap:3px"><span class="muted small">${esc(t.power[j].name)}</span><div class="chiplist">${chips(cs, list === t.mine)}</div></div>` : "")).join("");
      return `<div class="panel stack small" style="gap:6px"><div class="row between"><b>${t.gap ? `Turns ${t.gap}–${t.n}` : `Turn ${t.n}`}</b><span class="muted">${t.mine.length ? `spent ${t.spent} energy` : "you played nothing"}${t.left !== null && t.left !== undefined ? ` · ${t.left} left` : ""}</span></div>
        ${t.mine.length ? `<span class="small">You played</span><div class="row" style="align-items:flex-start;gap:12px">${at(t.mine)}</div>` : ""}
        ${t.theirs.length ? `<span class="small">They played</span><div class="row" style="align-items:flex-start;gap:12px">${at(t.theirs)}</div>` : ""}
        <span class="muted small">${t.power.map((p) => `${esc(p.name)} ${p.my ?? "?"}–${p.opp ?? "?"}`).join(" · ")}</span></div>`; }).join("")}
    ${m.session ? `<button class="btn sm ghost" data-a="reviewSession" data-id="${esc(m.session)}">See this match's pictures</button>` : ""}
    <span class="muted small">From the tracker's picture of the board each time you ended a turn. Their cards show on the turn they were revealed.</span></div>`;
}

/* ============ Standalone (Firebase) sign-in and storage ============ */
const FB_CFG_KEY = "snapstat.firebaseConfig", FB_SKIP_KEY = "snapstat.skipSignIn";
function parseFirebaseConfig(text) {
  const o = {}; for (const m of String(text || "").matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g)) o[m[1]] = m[2];
  return o.apiKey && o.authDomain && o.projectId && o.appId ? o : null;
}
const fbui = { busy: false, err: "", cfgText: "", cfgErr: "" };
function signInSheet() {
  const apple = window.SNAPSTAT_OPTIONS && window.SNAPSTAT_OPTIONS.apple;
  return `${sheetHead("Sign in to SNAP Stat", "Keep your stats on every device and use the social features")}
    <button class="btn snap block" data-a="signInGoogle" ${fbui.busy ? "disabled" : ""}>Continue with Google</button>
    ${apple ? `<button class="btn block" data-a="signInApple" ${fbui.busy ? "disabled" : ""}>Continue with Apple</button>` : ""}
    ${fbui.err ? `<p class="note">${esc(fbui.err)}</p>` : ""}
    <button class="btn ghost block" data-a="skipSignIn">Use without an account</button>
    <p class="muted small">Without an account, everything is saved on this device only. ${privacyLink()}</p>`;
}
function setupSheet() {
  return `${sheetHead("Connect your Firebase project", "One-time setup")}
    <p class="small">In the Firebase console, open Project settings, scroll to Your apps, and copy the <b>firebaseConfig</b> block. Paste it here.</p>
    <textarea id="fb-cfg" class="code" data-fbcfg="1" placeholder="const firebaseConfig = { apiKey: ... }">${esc(fbui.cfgText)}</textarea>
    ${fbui.cfgErr ? `<p class="note">${esc(fbui.cfgErr)}</p>` : ""}
    <button class="btn snap" data-a="saveFbConfig">Connect</button>
    <p class="muted small">This saves the settings on this device. To make sign-in work for everyone, also paste them into firebase-config.js before you upload the app.</p>`;
}
function fbErrText(e) {
  const c = (e && e.code) || "";
  if (c.includes("popup-closed") || c.includes("cancelled-popup")) return "";
  if (c.includes("popup-blocked")) return "Your browser blocked the sign-in window. Allow pop-ups for this site and try again.";
  if (c.includes("unauthorized-domain")) return "This web address isn't allowed to sign in yet. In Firebase, add it under Authentication › Settings › Authorized domains.";
  if (c.includes("operation-not-allowed")) return "This sign-in method isn't turned on yet. In Firebase, turn it on under Authentication › Sign-in method.";
  if (c.includes("network")) return "Couldn't reach Google. Check your connection and try again.";
  if (c.includes("web-storage") || c.includes("internal")) return "Sign-in didn't finish. If you opened this link inside another app, open it in Safari or Chrome instead.";
  return "Sign-in didn't work. Try again, or open the app in Safari or Chrome.";
}
async function doSignIn(kind) {
  fbui.busy = true; fbui.err = ""; refreshSheet();
  try { await store.fb.signIn(kind); closeSheet(); }
  catch (e) { fbui.err = fbErrText(e); if (sheetFn) refreshSheet(); }
  fbui.busy = false; if (sheetFn) refreshSheet();
}
async function initFirebase(local, lm) {
  store.provider = "firebase";
  store.downloads = { save: ({ filename, data }) => { const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: "application/json" })); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return Promise.resolve({ status: "saved" }); } };
  const api = await Promise.race([window.snapFirebaseReady || Promise.resolve(null), new Promise((r) => setTimeout(() => r(null), 12000))]);
  if (!api) {
    store.ready = true; render();
    if (api === null && window.snapFirebaseNeedsConfig) openSheet(setupSheet);
    else { toast("Couldn't connect to the server, so your data is saved on this device for now."); maybeOnboard(); }
    return;
  }
  store.fb = api;
  if (window.__overlay) { store.ready = true; startOverlay(window.__overlay === "me" ? "" : window.__overlay, api); return; }
  let started = false;
  api.onAuth((user) => {
    if (user) {
      if (started && store.uid === user.uid) return;
      store.user = { uid: user.uid, name: user.displayName || "", email: user.email || "" };
      store.db = api.db; store.uid = user.uid; store.mode = "cloud"; started = true;
      if (!S.me.name && store.user.name) S.me.name = store.user.name;
      store.assets = firebaseAssets;
      subscribeCloud(local, lm); store.ready = true; render(); loadOwner(); loadAccounts();
    } else {
      if (started) { location.reload(); return; }
      store.mode = "local"; store.ready = true; render();
      let skip = false; try { skip = localStorage.getItem(FB_SKIP_KEY) === "1"; } catch { /* ignore */ }
      if (!skip && !sheetFn) openSheet(signInSheet); else maybeOnboard();
    }
  });
}
async function loadSeed() {
  if (store.mode !== "cloud") { toast("Sign in first"); return; }
  try {
    const seed = await (await fetch("seed.json", { cache: "no-store" })).json();
    for (const [id, s] of Object.entries(obj(seed.seasons))) await store.db.doc("seasons/" + id).set(s);
    for (const [id, e] of Object.entries(obj(seed.events))) await store.db.doc("events/" + id).set(e);
    toast("Season and event history loaded");
  } catch (e) { toast("Couldn't load the season list. Try again."); }
}

  signInGoogle: () => doSignIn("google"),

  loadSeed: () => loadSeed(),
