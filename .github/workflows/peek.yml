# Temporary (round 2): saves copies of a few public pages so the season, event and location formats can be checked. Safe to delete.
name: Peek at data sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/peek.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p debug
          UA="Mozilla/5.0 (compatible; SNAP-Stat-card-updater/1.0)"
          get() { curl -sSL -A "$UA" --max-time 60 -o "debug/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 failed"; }
          get sf-season-nov26.html "https://snap.fan/seasons/november2026/"
          get sf-season-sep26.html "https://snap.fan/seasons/september2026/"
          get sf-season-dec26.html "https://snap.fan/seasons/december2026/"
          get sf-event-ca-oct26.html "https://snap.fan/events/ChampionArena_Oct26/"
          get sf-event-hst-oct26.html "https://snap.fan/events/HighStakesTables_Oct26/"
          get sf-schedule.html "https://snap.fan/schedule/"
          get sf-locations.html "https://snap.fan/locations/"
          ls -la debug
          # keep the files small
          for f in debug/*; do head -c 400000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add debug
          git diff --cached --quiet || (git commit -m "Peek at data sources" && git pull --rebase && git push)
