<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SNAP Stat">
<meta name="description" content="Unofficial fan-made MARVEL SNAP companion: match tracker, collection, decks, seasons and alliance.">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<title>SNAP Stat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one scrolling view, fixed bottom tab bar, bottom sheets for detail and forms.
   Look: deep-space nebula ground, comic lettering for page titles, halftone panels, blue energy / orange power pips,
   and a yellow-to-orange "snap" gradient reserved for the main action on each screen. Dark-first; light mirrors it as comic paper. */
:root {
  --bg: #1A0E3D;
  --bg-2: #4A1F93;
  --glow-1: rgba(168, 85, 247, .30);
  --glow-2: rgba(80, 140, 255, .16);
  --surface: #26145A;
  --surface-2: #331C73;
  --line: #4A2F8F;
  --fg: #F5F0FF;
  --muted: #BDAFE6;
  --snap-a: #FFD23F;
  --snap-b: #FF7A1A;
  --snap-ink: #1A0E00;
  --snap-text: #FFC53D;
  --snap-soft: rgba(255, 197, 61, .13);
  --cost: #3D8BFF;
  --power: #FF8A2B;
  --cube: #8FE3FF;
  --win: #3DD68C;
  --loss: #FF5D7B;
  --tie: #B4AED3;
  --warn: #FFB547;
  --dot: rgba(255, 255, 255, .07);
  --shadow: 0 18px 40px rgba(0, 0, 0, .5);
  --comic: "Bangers", "Impact", "Arial Narrow", sans-serif;
  --ui: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6F3FF; --bg-2: #E6DCFF; --glow-1: rgba(120, 72, 255, .12); --glow-2: rgba(0, 160, 255, .10); --surface: #FFFFFF; --surface-2: #EEE9FB;
    --line: #D9D1F2; --fg: #17132E; --muted: #5B557C; --snap-ink: #1A0E00; --snap-text: #A85F00; --snap-soft: rgba(224, 140, 0, .12);
    --cost: #2565E0; --power: #DB6412; --cube: #0B7FB0; --win: #0F8A52; --loss: #CC2F4C; --tie: #6F6893; --warn: #9A6200;
    --dot: rgba(23, 19, 46, .07); --shadow: 0 18px 40px rgba(40, 30, 90, .18); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F6F3FF; --bg-2: #E6DCFF; --glow-1: rgba(120, 72, 255, .12); --glow-2: rgba(0, 160, 255, .10); --surface: #FFFFFF; --surface-2: #EEE9FB;
  --line: #D9D1F2; --fg: #17132E; --muted: #5B557C; --snap-ink: #1A0E00; --snap-text: #A85F00; --snap-soft: rgba(224, 140, 0, .12);
  --cost: #2565E0; --power: #DB6412; --cube: #0B7FB0; --win: #0F8A52; --loss: #CC2F4C; --tie: #6F6893; --warn: #9A6200;
  --dot: rgba(23, 19, 46, .07); --shadow: 0 18px 40px rgba(40, 30, 90, .18); color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: radial-gradient(1200px 600px at 85% -10%, var(--glow-1), transparent 60%), radial-gradient(900px 500px at -10% 30%, var(--glow-2), transparent 60%), linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 55%, var(--bg-2)) 55%, var(--bg-2) 100%);
  background-attachment: fixed; color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(80px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--snap-a); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.wrap { max-width: 780px; margin: 0 auto; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top > div:first-child { min-width: 0; flex: 1 1 auto; }
.brand { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; font-family: var(--comic); font-size: 24px; letter-spacing: .04em; white-space: nowrap; line-height: 1; min-width: 0; }
.brand > span { overflow: hidden; text-overflow: ellipsis; padding: .06em .22em .06em 0; } /* room for the slanted letters, so the last T isn't clipped */
.brand .ic { width: 28px; height: 28px; color: var(--cube); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--cube) 60%, transparent)); }
.brand b { font-weight: 400; color: var(--cube); }
.sync { font-family: var(--ui); font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.me-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; max-width: 46%; min-width: 0; flex: 0 1 auto; }
.me-chip span.h { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

/* Avatars: stylized tiles (never official art) or the person's own uploaded picture */
.av { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-family: var(--comic); font-size: 17px; flex: none; color: #fff; overflow: hidden; position: relative; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.lg { width: 76px; height: 76px; border-radius: 18px; font-size: 40px; border: 3px solid var(--bg); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.art { background-image: radial-gradient(var(--artdot, rgba(255,255,255,.22)) 1px, transparent 1.5px), linear-gradient(150deg, var(--a1), var(--a2)); background-size: 5px 5px, 100% 100%; }

/* Bottom nav */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); font-family: var(--ui); font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 10px; position: relative; }
.tabs button .ic { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--snap-text); background: var(--snap-soft); }
.tabs .badge { position: absolute; top: 2px; right: 22%; min-width: 16px; height: 16px; border-radius: 8px; background: var(--loss); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

.ic { width: 18px; height: 18px; flex: none; }
.cube { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.cube .ic { width: 14px; height: 14px; color: var(--cube); }

/* Type */
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--comic); font-weight: 400; font-size: 38px; letter-spacing: .03em; line-height: 1; background: linear-gradient(180deg, var(--snap-a), var(--snap-b)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.35)); }
h2 { font-family: var(--ui); font-size: 21px; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .02em; }
h3 { font-family: var(--ui); font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.eyebrow { font-family: var(--ui); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.num { font-family: var(--ui); font-variant-numeric: tabular-nums; }
p { margin: 0; }

/* Structure */
#view { display: flex; flex-direction: column; gap: 22px; padding-block: 18px 12px; }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; } .row.nowrap { flex-wrap: nowrap; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.halftone { position: relative; isolation: isolate; overflow: hidden; }
.halftone::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(var(--dot) 1.2px, transparent 1.6px); background-size: 7px 7px; pointer-events: none; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.li { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); min-width: 0; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.li:hover { background: var(--surface-2); }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; color: var(--muted); }
.empty strong { color: var(--fg); }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 9px 14px; font-weight: 600; min-height: 40px; }
a.btn { color: var(--fg); text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.snap { background: linear-gradient(180deg, var(--snap-a), var(--snap-b)); color: var(--snap-ink); border-color: transparent; font-family: var(--ui); font-weight: 800; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.snap.sm { font-size: 13px; }
.btn.danger { color: var(--loss); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.flow { flex-wrap: wrap; overflow: visible; }
/* Emotes */
.emo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.emo-tile { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.emo-pick { position: relative; aspect-ratio: 1; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 6px; display: grid; place-items: center; }
.emo-tile.own .emo-pick { border-color: var(--win, #4ade80); box-shadow: 0 0 0 1px var(--win, #4ade80) inset; }
.emo-tile:not(.own) .emo-img { opacity: .62; filter: saturate(.7); }
.emo-pick .emo-img { width: 100%; height: 100%; object-fit: contain; }
.emo-tick { position: absolute; top: 4px; right: 6px; font-weight: 800; color: var(--win, #4ade80); }
.emo-info { display: flex; align-items: flex-start; gap: 2px; }
.emo-n { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.emo-info .star { flex: none; padding: 0 2px; }
.emo-d { font-size: 11px; color: var(--muted); }
.emo-txt { display: inline-block; background: #fff; color: #1a1236; border-radius: 12px; padding: 4px 9px; font-weight: 800; font-size: 12px; line-height: 1.2; max-width: 100%; text-align: center; }
.emo-txt.xs { font-size: 10px; padding: 2px 6px; }
.emo-img.xs { width: 22px; height: 22px; object-fit: contain; }
.emo-img.md { width: 64px; height: 64px; object-fit: contain; }
.emo-bar { display: flex; flex-wrap: wrap; gap: 6px; }
.emo-bar.sm { margin-left: 24px; }
.emo-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 9px 3px 4px; font-size: 12px; font-weight: 700; }
.emo-chip.on { border-color: var(--snap-text, #ffd23f); background: rgba(255, 210, 63, .12); }
.emo-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.emo-opt { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 4px; font-size: 11px; line-height: 1.15; min-width: 0; }
.emo-opt span { overflow-wrap: anywhere; text-align: center; }
.emo-opt.on { border-color: var(--snap-text, #ffd23f); background: rgba(255, 210, 63, .14); }
.emo-sticker .emo-img.md { width: 72px; height: 72px; }
.cmt-w { display: flex; flex-direction: column; gap: 4px; }
.cmt { align-items: flex-start; }
.cmt-emo { margin-left: auto; flex: none; }
.cmt-emo button { background: none; border: 0; color: var(--muted); padding: 2px; display: inline-flex; }
.cmt-emo.big button { padding: 6px; }
.chips.flow .chip { white-space: normal; text-align: left; }
.chip.on, .chip[aria-pressed="true"].ttl { border-color: var(--ok, #4ade80); }
.chip:disabled { opacity: .55; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 7px 4px; font-family: var(--ui); font-weight: 700; font-size: 14px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.seg button { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg:has(> button:nth-child(4)) button { font-size: 13px; letter-spacing: .01em; padding-inline: 2px; }
.seg:has(> button:nth-child(5)) button { font-size: 12.5px; letter-spacing: 0; text-transform: none; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line), inset 0 -2px 0 var(--snap-a); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em; min-width: 0; }
input[type=text], input[type=number], input[type=search], input[type=date], input[type=datetime-local], input[type=email], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font-size: 15px; color: var(--fg); min-width: 0; }
textarea { resize: vertical; min-height: 70px; }
textarea.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; min-height: 120px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--fg); }
.check input { width: 18px; height: 18px; accent-color: var(--snap-b); flex: none; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toggle-row:last-child { border-bottom: 0; }

/* Pills / state */
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.pill.W { background: color-mix(in srgb, var(--win) 18%, transparent); color: var(--win); }
.pill.L { background: color-mix(in srgb, var(--loss) 18%, transparent); color: var(--loss); }
.pill.T { background: color-mix(in srgb, var(--tie) 20%, transparent); color: var(--tie); }
.pill.gold { background: var(--snap-soft); color: var(--snap-text); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.dim { background: var(--surface-2); color: var(--muted); }
.pill.live { background: color-mix(in srgb, var(--loss) 20%, transparent); color: var(--loss); }
.pos { color: var(--win); } .neg { color: var(--loss); }
.rank { display: inline-grid; place-items: center; min-width: 46px; height: 46px; padding: 0 6px; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); background: linear-gradient(160deg, #7C5CFF, #2D1E7A); color: #fff; font-family: var(--ui); font-weight: 800; font-size: 17px; }
.rank.inf { background: linear-gradient(160deg, var(--snap-a), var(--snap-b)); color: var(--snap-ink); font-size: 13px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--snap-a), var(--snap-b)); border-radius: 99px; }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.tile .v { font-family: var(--ui); font-weight: 800; font-size: 25px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .k { font-family: var(--ui); font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.hero-stat { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.ring { width: 96px; height: 96px; }
.ring text { font-family: var(--ui); font-weight: 800; fill: var(--fg); }
.wallet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.wallet button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 10px; min-width: 0; }
.wallet .v { font-family: var(--ui); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.wallet .k { font-family: var(--ui); font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--ui); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

/* Season hero */
.season { border-radius: 18px; padding: 16px; color: #fff; background: linear-gradient(135deg, #4B2BD6, #1A1260 55%, #0B2F6E); border: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; gap: 10px; }
.season .nm { font-family: var(--comic); font-size: 32px; line-height: 1; letter-spacing: .03em; text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.season .eyebrow { color: rgba(255,255,255,.75); }
.season .bar { background: rgba(255,255,255,.18); }
.season .muted { color: rgba(255,255,255,.75); }
.season .halftone-dots { --dot: rgba(255,255,255,.08); }
.ev { display: flex; gap: 10px; align-items: center; }
.ev .when { font-family: var(--ui); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

/* Card tiles: original design, cost pip left (blue), power pip right (orange); stylized fills, never official art */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.ct { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 12px; border: 2px solid rgba(255,255,255,.14); padding: 30px 7px 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; min-width: 0; color: #fff; overflow: hidden; }
.ct .nm { font-family: var(--ui); font-weight: 800; font-size: 14px; line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; text-shadow: 0 1px 2px rgba(0,0,0,.7); position: relative; }
.ct .sub { font-size: 10.5px; opacity: .85; position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.ct .glyph { position: absolute; inset: 22% 0 auto; text-align: center; font-family: var(--comic); font-size: 44px; opacity: .3; }
.pip { position: absolute; top: 5px; width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-family: var(--ui); font-weight: 800; font-size: 15px; color: #fff; border: 2px solid rgba(255,255,255,.7); box-shadow: 0 1px 3px rgba(0,0,0,.5); z-index: 1; }
.pip.cost { left: 5px; background: var(--cost); }
.pip.pow { right: 5px; background: var(--power); }
.ct.miss { filter: grayscale(.85) brightness(.7); border-style: dashed; }
.ct.own { border-color: color-mix(in srgb, var(--snap-a) 55%, transparent); }
.ct .tag { position: absolute; top: 34px; right: 6px; font-size: 13px; color: var(--snap-a); text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.ct .tag.l { left: 6px; right: auto; }
.series-row { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; color: inherit; text-align: left; width: 100%; }
.series-row .lbl { font-weight: 700; font-size: 13px; }
.series-row[aria-pressed="true"] .lbl { color: var(--snap-text); }
a.li { color: inherit; text-decoration: none; }
.cwrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cwrap .ct .nm { display: none; }
.cname { display: flex; align-items: flex-start; min-width: 0; }
.cname .t { flex: 1; min-width: 0; padding: 4px 0 0 2px; font-size: 12px; font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.star { flex: none; width: 32px; height: 28px; margin: 0 -4px 0 0; padding: 0; border: 0; background: none; font-size: 19px; line-height: 1; color: var(--muted); cursor: pointer; }
.star[aria-pressed="true"] { color: var(--snap-text); }
.ct .cimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.ct.has-img { background: transparent; border-color: transparent; padding: 0; width: 100%; }
.ct.has-img.miss { border-color: transparent; }
.ct.has-img .glyph, .ct.has-img .pip, .ct.has-img .nm { display: none; }
.ct.has-img .sub { position: absolute; left: 4px; right: 4px; bottom: 2px; background: rgba(10,9,24,.8); border-radius: 6px; padding: 1px 5px; }
.ct.has-img .tag { top: auto; bottom: 20px; z-index: 1; }
.ct.has-img .tag.l { left: 4px; } .ct.has-img .tag:not(.l) { right: 4px; }
.banner.has-img .big { display: none; }
.av .aimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
.vthumb { width: 44px; height: 58px; object-fit: contain; flex: none; }
.vprev { display: grid; place-items: center; }
.vprev img { width: min(220px, 60vw); aspect-ratio: 3 / 4; object-fit: contain; }
.cchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px 4px 4px; font-size: 13px; font-weight: 600; max-width: 100%; min-width: 0; }
.cchip > span:last-child { overflow: hidden; text-overflow: ellipsis; }
.cchip .c { width: 20px; height: 20px; border-radius: 50%; background: var(--cost); color: #fff; display: grid; place-items: center; font-family: var(--ui); font-weight: 800; font-size: 12px; flex: none; }
.cchip .p { min-width: 20px; height: 20px; border-radius: 10px; background: var(--power); color: #fff; display: grid; place-items: center; font-family: var(--ui); font-weight: 800; font-size: 12px; flex: none; padding: 0 4px; }
.cchip.miss { border-style: dashed; color: var(--muted); }
.cchip.cmini { flex-direction: column; align-items: stretch; width: 76px; padding: 3px; gap: 3px; border-radius: 10px; vertical-align: top; text-align: center; }
.cchip.cmini > span:last-child { overflow: hidden; }
.cmini .cpic { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 7px; overflow: hidden; }
.cmini .cpic .cimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.cmini .cpic .c, .cmini .cpic .p { position: absolute; top: 3px; z-index: 1; width: 20px; min-width: 20px; height: 20px; font-size: 11px; }
.cmini .cpic .c { left: 3px; } .cmini .cpic .p { right: 3px; }
.cmini .cpic.has-img .c, .cmini .cpic.has-img .p.base { display: none; }
.cmini .cpic.has-img .p.now { top: auto; bottom: 3px; right: 3px; box-shadow: 0 0 0 2px var(--surface); }
.cmini .nm { font-size: 11px; line-height: 1.15; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.cchip.cmini.xs { width: 58px; padding: 2px; gap: 2px; } .cmini.xs .nm { font-size: 9.5px; hyphens: auto; word-break: normal; overflow-wrap: anywhere; } .cmini.xs .cpic .c, .cmini.xs .cpic .p { width: 16px; min-width: 16px; height: 16px; font-size: 10px; }
.loc .side { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
details.chap { display: block; padding: 12px 14px; } details.chap > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; }
details.chap > summary::-webkit-details-marker { display: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--snap-text); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
.subnav .subhome { color: var(--snap-text); border-style: dashed; }
#view.swipe-l { animation: swipeL .22s ease-out; } #view.swipe-r { animation: swipeR .22s ease-out; }
@keyframes swipeL { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes swipeR { from { transform: translateX(-28px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #view.swipe-l, #view.swipe-r { animation: none; } }

.cchip.on { border-color: var(--snap-a); background: var(--snap-soft); }
.chiplist { display: flex; flex-wrap: wrap; gap: 6px; }

/* Curve */
.curve { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; align-items: end; height: 90px; }
.curve div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; font-size: 11px; color: var(--muted); }
.curve i { display: block; width: 100%; border-radius: 5px 5px 2px 2px; background: var(--cost); min-height: 3px; }

/* Live tracker */
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.loc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.loc .lh { background: linear-gradient(160deg, #3A2A8C, #191245); padding: 6px; }
.loc .lab { margin-top: 4px; font-size: 10.5px; line-height: 1.25; color: rgba(255,255,255,.85); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.lrow { align-items: flex-start; }
.lrow .s { white-space: normal; overflow: visible; text-overflow: clip; }
.lrow .lph { position: relative; overflow: hidden; width: 56px; height: 56px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--comic); font-size: 24px; color: #fff; }
.lrow .lthumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.loc .lh input { font-size: 13px; padding: 5px 7px; font-weight: 700; background: rgba(0,0,0,.25); border-color: rgba(255,255,255,.18); color: #fff; }
.loc .side { display: flex; flex-direction: column; gap: 4px; min-height: 34px; padding: 6px; }
.loc .side.opp { border-bottom: 1px dashed var(--line); }
.loc .tot { display: flex; justify-content: space-between; align-items: center; font-family: var(--ui); font-weight: 800; font-size: 18px; padding: 2px 6px; }
.loc .tot.win { color: var(--win); } .loc .tot.lose { color: var(--loss); }
.loc .cchip { font-size: 12px; padding: 3px 5px 3px 3px; gap: 4px; }
.loc .cchip .c, .loc .cchip .p { width: 18px; min-width: 18px; height: 18px; font-size: 11px; }
.zone { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meter { height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--win), var(--warn), var(--loss)); position: relative; }
.meter b { position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 2px; background: var(--fg); box-shadow: 0 0 0 2px var(--bg); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { background: var(--surface-2); border: 0; width: 38px; height: 38px; font-size: 18px; font-weight: 700; }
.stepper span { min-width: 46px; text-align: center; font-family: var(--ui); font-weight: 800; font-size: 19px; }
.prob { display: grid; grid-template-columns: minmax(0, 1fr) 90px 38px; gap: 8px; align-items: center; font-size: 13px; }
.prob .bar { height: 6px; }

/* Social */
.post { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.post-h { display: flex; gap: 10px; align-items: center; }
.post-h .who { flex: 1; min-width: 0; }
.post-h .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.post .att { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.post .acts { display: flex; gap: 4px; flex-wrap: wrap; }
.post .acts button { background: none; border: 1px solid transparent; border-radius: 8px; padding: 5px 8px; display: inline-flex; gap: 5px; align-items: center; color: var(--muted); font-weight: 600; font-size: 13px; }
.post .acts button.on { color: var(--snap-text); }
.post .acts button.down.on { color: var(--loss); }
.cmt { display: flex; gap: 8px; font-size: 14px; }
.cmt b { flex: none; }
.banner { height: 120px; border-radius: 16px; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 10px 12px; color: #fff; }
.banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.banner .cap { position: relative; font-size: 11px; background: rgba(0,0,0,.45); border-radius: 6px; padding: 2px 6px; margin-left: auto; }
.banner .big { position: absolute; right: 12px; top: 6px; font-family: var(--comic); font-size: 46px; opacity: .3; }
.prof-head { display: flex; gap: 12px; align-items: flex-start; margin-top: -40px; padding-inline: 12px; position: relative; z-index: 3; }
.prof-head > .stack { padding-top: 44px; }
.prof-head > .rank { margin-top: 44px; }

/* Custom card */
.cc { width: 160px; max-width: 100%; aspect-ratio: 3 / 4; border-radius: 16px; padding: 10px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; color: #fff; overflow: hidden; border: 2px solid rgba(255,255,255,.25); }
.cc .pip { width: 32px; height: 32px; font-size: 19px; top: 8px; }
.cc .pip.cost { left: 8px; } .cc .pip.pow { right: 8px; }
.cc .glyph { position: absolute; inset: 40px 0 auto; text-align: center; font-family: var(--comic); font-size: 60px; opacity: .35; }
.cc .nm { font-family: var(--ui); font-weight: 800; font-size: 17px; text-transform: uppercase; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.5); position: relative; }
.cc .ab { font-size: 11px; line-height: 1.25; background: rgba(0,0,0,.42); border-radius: 6px; padding: 5px 6px; position: relative; }
.fr-0 { background: linear-gradient(160deg, #3B2A8C, #120C33); } .fr-1 { background: linear-gradient(160deg, #B5212E, #3D0710); }
.fr-2 { background: linear-gradient(160deg, #0E7C66, #04241E); } .fr-3 { background: linear-gradient(160deg, #C48A12, #3A2600); }
.fr-4 { background: linear-gradient(160deg, #6B6B7E, #18181F); } .fr-5 { background: conic-gradient(from 200deg, #E2489C, #6F5CFF, #23C7D9, #F4B740, #E2489C); }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(6, 4, 18, .66); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 660px; max-height: 90%; overflow-y: auto; border-radius: 20px 20px 0 0; border: 1px solid var(--line); border-bottom: 0; box-shadow: var(--shadow);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.sheet-body { display: flex; flex-direction: column; gap: 14px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-h h2 { min-width: 0; overflow-wrap: anywhere; }
.x { background: var(--surface-2); border: 1px solid var(--line); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 20px; text-align: center; line-height: 1.35; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--snap-b); padding: 6px 10px; background: var(--snap-soft); border-radius: 0 8px 8px 0; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.alert:last-child { border-bottom: 0; }
.alert .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
.ok-bg { background: var(--win); } .short-bg { background: var(--warn); }
.ai-out { white-space: pre-wrap; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.loc .ltip { margin-top: 3px; font-size: 10px; line-height: 1.25; color: rgba(255,255,255,.72); font-style: italic; }
ul.tips { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; } .qgrid.three { grid-template-columns: repeat(3, 1fr); }
.qgrid .btn { min-height: 54px; font-size: 18px; font-weight: 800; }
.btn.qw { background: color-mix(in srgb, var(--win) 22%, var(--surface-2)); border-color: color-mix(in srgb, var(--win) 45%, transparent); color: var(--fg); }
.btn.ql { background: color-mix(in srgb, var(--loss) 22%, var(--surface-2)); border-color: color-mix(in srgb, var(--loss) 45%, transparent); color: var(--fg); }
.cchip.addc { border-color: color-mix(in srgb, var(--win) 55%, transparent); color: var(--win); padding: 4px 8px; }
.cchip.remc { border-color: color-mix(in srgb, var(--loss) 55%, transparent); color: var(--loss); padding: 4px 8px; text-decoration: line-through; }
.cchip .x { width: 20px; height: 20px; min-height: 0; padding: 0; border: 0; background: none; }
.bracket { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
.bround { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; min-width: 150px; flex: none; }
.bm { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; }
.bp { display: block; width: 100%; text-align: left; padding: 8px 10px; font-size: 14px; background: none; border: 0; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bp + .bp { border-top: 1px solid var(--line); }
button.bp:hover { background: var(--surface-2); }
.bp.won { font-weight: 800; background: color-mix(in srgb, var(--win) 16%, transparent); }
.bsug { padding: 6px 10px; border-top: 1px dashed var(--line); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
details.panel > summary { cursor: pointer; font-weight: 600; }
.cmsg { padding: 10px 12px; border-radius: 14px; font-size: 14px; max-width: 88%; line-height: 1.45; }
.cmsg.me { align-self: flex-end; background: var(--snap-soft); border: 1px solid color-mix(in srgb, var(--snap-a) 40%, transparent); }
.cmsg.coach { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); }
#coach-log { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; }
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.badge-c { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); opacity: .72; min-width: 0; }
.badge-c.on { opacity: 1; border-color: color-mix(in srgb, var(--snap-a) 55%, var(--line)); background: linear-gradient(160deg, var(--snap-soft), var(--surface)); }
.chip.swatch { display: inline-flex; align-items: center; gap: 6px; }
.chip.swatch .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); flex: none; }
html.overlay, html.overlay body { background: transparent !important; }
html.overlay .top, html.overlay #tabs, html.overlay #sheet { display: none !important; }
html.overlay .wrap { padding: 8px !important; }
.ov-card { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; background: rgba(10, 9, 24, .82); color: #F2EFFF; border: 1px solid rgba(255,255,255,.18); max-width: 420px; font-family: var(--ui); font-size: 18px; }
.ov-row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.ov-pill { background: linear-gradient(180deg, var(--snap-a), var(--snap-b)); color: var(--snap-ink); border-radius: 999px; padding: 1px 10px; font-weight: 800; font-size: 15px; }
.ov-small { font-size: 14px; opacity: .85; font-family: var(--body); }
.ov-card .pos { color: #3DD68C; } .ov-card .neg { color: #FF5D7B; }
.shot-thumb { width: 56px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); flex: none; }
@media (max-width: 420px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .wallet { grid-template-columns: repeat(2, 1fr); }
  .grid3 { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 34px; }
  .tabs button { font-size: 10.5px; }
}
@media (min-width: 700px) { .tabs { left: 50%; transform: translateX(-50%); max-width: 780px; border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; } }
/* Profile pictures and banners: a face or frameless art, placed by the picker, with an optional Custom Card border */
.av { --bw: 3px; } .av.lg { --bw: 6px; } .av.xl { width: 150px; height: 150px; border-radius: 30px; font-size: 70px; --bw: 12px; }
.av .lki, .banner .lki, .banner .lkb { position: absolute; max-width: none; object-fit: fill; inset: auto; }
.banner.look { height: auto; aspect-ratio: 5 / 2; padding: 0; }
.banner { --bw: 9px; }
.banner .lkb { width: 100% !important; height: 100% !important; left: 0 !important; top: 0 !important; object-fit: cover; filter: blur(14px) brightness(.5) saturate(1.2); transform: scale(1.2); }
.banner .cap { z-index: 3; position: absolute; right: 12px; bottom: 12px; }
.banner.look .big { z-index: 0; }
.bd { position: absolute; inset: 0; z-index: 2; pointer-events: none; border: var(--bw, 4px) solid transparent; border-image: var(--bi) 10% 12.5% / var(--bw, 4px) stretch; }
.bd.drawn { --bdg: linear-gradient(135deg, color-mix(in srgb, var(--bc, #9aa0ab) 50%, #fff), var(--bc, #9aa0ab) 45%, color-mix(in srgb, var(--bc, #9aa0ab) 55%, #000)); border-image: var(--bdg) 1; }
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.bd.drawn.fx-shimmer, .bd.drawn.fx-infinity { --bdg: conic-gradient(from var(--ang), var(--bc, #cfd6e2), #fff 12%, var(--bc, #cfd6e2) 30%, color-mix(in srgb, var(--bc, #cfd6e2) 45%, #000) 50%, var(--bc, #cfd6e2) 70%, #fff 86%, var(--bc, #cfd6e2)); animation: bdSpin 4s linear infinite; }
.bd.drawn.rainbow { --bdg: conic-gradient(from var(--ang), #ff5f6d, #ffc94a, #34d27a, #2ee6d6, #3b82f6, #9b5cff, #ff5f6d); animation: bdSpin 5s linear infinite; }
/* Banner frames: rounded inside and out. The corners scale with the banner, so they match the frame pictures at any size. */
.banner.look { border-radius: 4.5% / 11.25%; }
.banner .bd, .banner .bd::after { border-radius: inherit; }
.banner .bd.bn { border: 0; border-image: none; background: var(--bb) 0 0 / 100% 100% no-repeat; }
.banner .bd.bn::after { inset: 0; }
.banner .bd.drawn { border-image: none; background: var(--bdg) border-box; -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0); }
@keyframes bdSpin { to { --ang: 360deg; } }

/* ============ The game's clock ============
   MARVEL SNAP's day resets at 19:00 UTC: 12:00 PM Pacific in summer and 11:00 AM in winter (the time stays put in UTC,

const RESET_UTC_HOUR = 19;
const REFRESH_UTC_HOURS = [3, 11, 19];

  return best;
}
function refreshTimes(now = Date.now()) { const out = []; let t = now; for (let i = 0; i < 3; i++) { t = next8hRefresh(t); out.push(t); } return out; }
// The game's day: the one that started at the last reset.
const gameDay = (ts = Date.now()) => new Date(ts - RESET_UTC_HOUR * 3600e3).toISOString().slice(0, 10);
const clockTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

function seasonTimes(s) {

  const end = s.end ? resetOn(addDaysIso(s.end, 1)) : Infinity;

  return { startTs, endTs: end - 1 };

// Countdowns tick every second while the app is open; when one runs out, the page redraws (a new day, a new season…).
// Only numbers count (form fields elsewhere use data-cd for other things), and a timer that has run out stops ticking,
// so the redraw happens once.
function tickCountdowns() {
  if (document.hidden) return;
  const now = Date.now(); let due = false;
  document.querySelectorAll("[data-cd]").forEach((el) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    const t = Number(el.dataset.cd); if (!Number.isFinite(t) || t <= 0) return;
    if (t <= now) { el.removeAttribute("data-cd"); el.textContent = countdown(t); due = true; return; }
    const s = countdown(t); if (el.textContent !== s) el.textContent = s;

function predictionHtml() {

async function runPredict() {
  live.predBusy = true; render();
  try {
    if (!store.sample) live.pred = predictLocal();
    else {
      const seen = live.opp.map((o) => `${card(o.key).name} (${o.zone.startsWith("L") ? "played at " + (live.locs[num(o.zone.slice(1))] || "location " + (num(o.zone.slice(1)) + 1)) : o.zone}${o.turn ? ", turn " + o.turn : ""})`).join("; ");
      const history = predictLocal().deck.slice(0, 8).map((d) => d.name).join(", ");
      const prompt = `You are a MARVEL SNAP expert. Predict the opponent's deck and hand mid-match.
Turn ${live.turn} of ${live.lastTurn}. Opponent hand size: ${live.oppHand}. Opponent cards seen: ${seen || "none yet"}.
Locations: ${live.locs.map((n, i) => n || "Location " + (i + 1)).join(", ")}. They snapped: ${live.oppSnap ? "yes" : "no"}.
Cards that often appeared with these in this player's past opponents: ${history || "no history"}.
Use real MARVEL SNAP card names. Reply with JSON only: {"archetype": "deck name", "deck": [{"name": card, "chance": 0-100}] (up to ${Math.max(4, 12 - live.opp.length)} cards they likely still have), "inHand": [{"name": card, "chance": 0-100, "why": "short"}] (up to 5), "watchOut": ["short warnings about plays to expect"], "tip": "one sentence of advice for this turn"}`;
      const r = await store.sample.json(prompt, { modelTier: "default" });
      live.pred = { archetype: String(r.archetype || ""), deck: arr(r.deck).slice(0, 12), inHand: arr(r.inHand).slice(0, 5), watchOut: arr(r.watchOut).map(String).slice(0, 4), tip: String(r.tip || "") };
    }
  } catch (e) { live.pred = predictLocal(); toast(e && e.code === "rate_limited" ? "AI is busy, so this guess uses your history." : "AI wasn't available, so this guess uses your history."); }
  live.predBusy = false; saveLive(); render();
}

const sv = { text: "", res: null, err: "", owned: true, decks: true, past: false, showAll: false };
function ensureCodeCard(code) {
  const c = cardByCode(code); if (c) return c.key;
  const d = catCardByCode(code); // in the daily card list but not the app's own (event cards like Vampire America Chavez)
  const name = d ? String(d.name) : `Unknown card (${code})`; const k = keyOf(name);
  if (!S.addedCards.some((x) => x.key === k)) S.addedCards.push({ key: k, name, cost: d && d.cost !== undefined ? num(d.cost) : "?", power: d && d.power !== undefined ? num(d.power) : "?", tags: [], ability: d ? String(d.ability || "") : "", series: "", release: "", code });
  return k;
}
function decodeCodes(b64) { try { const raw = atob(String(b64 || "").trim()); return /^[A-Za-z0-9]+(,[A-Za-z0-9]+)*$/.test(raw) ? raw.split(",") : []; } catch { return []; } }
function parseSnapVault(text) {
  let j; try { j = JSON.parse(text); } catch { return { err: "That file isn't a SnapVault export. In SnapVault, tap Export decks & collections and choose that file." }; }
  const codes = [...new Set(arr(obj(j.collection).cards).map(String).filter((c) => /^[A-Za-z0-9]+$/.test(c)))];
  const decks = arr(j.decks).map((d) => {
    const vs = arr(d.variations).slice().sort((a, b) => num(a.version) - num(b.version)); const latest = vs[vs.length - 1] || {};
    const name = String(d.name || "SnapVault deck").trim().slice(0, 60);
    return { name, codes: decodeCodes(latest.deckCode), w: vs.reduce((s, v) => s + num(v.wins), 0), l: vs.reduce((s, v) => s + num(v.losses), 0), lw: num(latest.wins), ll: num(latest.losses), versions: vs.length, vers: vs.map((v) => ({ v: num(v.version), w: num(v.wins), l: num(v.losses), at: v.createdAt })), created: d.createdAt, exists: S.decks.some((x) => x.sv === name) };
  }).filter((d) => d.codes.length);
  if (!codes.length && !decks.length) return { err: "No cards or decks were found in that file." };
  const all = [...new Set([...codes, ...decks.flatMap((d) => d.codes)])];
  return { codes, decks, known: codes.filter((c) => cardByCode(c)).length, unknown: all.filter((c) => !cardByCode(c) && !catCardByCode(c)), newOwned: codes.filter((c) => { const x = cardByCode(c); return !x || !S.owned[x.key]; }).length, date: j.exportDate };
}

document.addEventListener("input", (e) => {
  const t = e.target, d = t.dataset;
  if (d.bind) {
    setPath(S, d.bind, d.num ? (t.value === "" ? "" : num(t.value)) : t.value); save();
    if (d.bind.startsWith("me.")) $("#mechip").innerHTML = `${avatarHtml(S.me.avatar, S.me.handle || "?", store.uid || "me")}<span class="h">${esc(S.me.handle || "Set up profile")}</span>`;
    if (d.bind.startsWith("wallet.")) { const box = $("#shop-alerts"); if (box) box.innerHTML = shopAlertsHtml(); }
    if (d.bind === "me.rank" || d.bind === "me.peak") { const cs = currentSeason(); if (cs) { const r = (S.ranks["s:" + cs.id] = obj(S.ranks["s:" + cs.id])); r[d.bind === "me.rank" ? "end" : "peak"] = t.value; } }
    return;
  }
  if (d.rpnote) { rp.note = t.value; return; }
  if (d.mc) { mc.text = t.value; return; }
  if (d.ui) { ui[d.ui] = t.value; render(); return; }
  if (d.live) { if (d.live.startsWith("loc")) { live.locs[num(d.live.slice(3))] = t.value; showLocInfo(t); } else live[d.live] = t.value; saveLive(); return; }
  if (d.livewp) { live.sig.winPct = t.value; saveLive(); return; }
  if (d.pick) { picker.q = t.value; refreshSheet(); return; }
  if (d.mf) { mf[d.mf] = d.mf === "ts" ? (new Date(t.value).getTime() || mf.ts) : d.mf === "turn" ? num(t.value, 6) : t.value; return; }
  if (d.mfloc) { mf.locs[num(d.i)][d.mfloc] = t.value; return; }
  if (d.deck) { const dk = deckEdit(); if (dk) { dk[d.deck] = t.value; save(); } return; }
  if (d.ai) { ai[d.ai] = t.value; return; }
  if (d.imp) { imp.text = t.value; return; }
  if (d.rs) { rs.text = t.value; return; }
  if (d.sv) { sv.text = t.value; return; }
  if (d.pc) { pc[d.pc] = t.value; return; }
  if (d.se) { se[d.se] = ["cards", "variants", "rewards"].includes(d.se) ? t.value.split("\n").map((s) => s.trim()).filter(Boolean) : t.value; return; }
  if (d.ee) { ee[d.ee] = d.ee === "collectibles" ? t.value.split("\n").map((s) => s.trim()).filter(Boolean) : t.value; return; }
  if (d.ve) { ve[d.ve] = t.value; return; }
  if (d.prog) { const key = "s:" + d.id; const r = (S.ranks[key] = obj(S.ranks[key])); r[d.f] = t.value; const cs = currentSeason(); if (cs && cs.id === d.id) { if (d.f === "end") S.me.rank = t.value; if (d.f === "peak") S.me.peak = t.value; } save(); return; }
  if (d.evnotes) { (S.eventProg[d.evnotes] = obj(S.eventProg[d.evnotes])).notes = t.value; save(); return; }
  if (d.cd) { cd[d.cd] = t.value; const prev = $("#cd-prev"); if (prev) prev.innerHTML = customCardHtml(cd); return; }
});
document.addEventListener("change", (e) => {

    else { const p = S.localPromos.find((x) => x.id === id); if (p) { p.status = t.value; save(); } }
    render(); return;
  }
  if (d.deckvar) { const dk = deckEdit(); if (dk) { if (t.value) dk.variants[d.deckvar] = t.value; else delete dk.variants[d.deckvar]; save(); render(); } return; }
  if (d.deckchk) { const dk = deckEdit(); if (!dk) return; if (d.deckchk === "public") dk.public = t.checked; else S.me.featuredDeck = t.checked ? dk.id : S.me.featuredDeck === dk.id ? "" : S.me.featuredDeck; save(); render(); refreshSheet(); return; }
  if (d.coll) { const it = lastColl.items[num(d.i)]; if (it) { setCollectible(it, lastColl.src, d.coll, t.checked); save(); render(); refreshSheet(); } return; }
  if (d.evchk) { (S.eventProg[d.id] = obj(S.eventProg[d.id]))[d.evchk] = t.checked; save(); return; }
  if (d.avsel) { if (t.value) { S.me[d.avsel] = { kind: "variant", ref: t.value }; save(); render(); toast(d.avsel === "banner" ? "Banner updated" : "Profile picture updated"); } return; }
  if (d.upload) { const f = t.files && t.files[0]; t.value = ""; if (f) uploadImage(f, d.upload); return; }
  if (d.svquick) { const f = t.files && t.files[0]; t.value = ""; if (!f) return; f.text().then(svQuickSync).catch(() => toast("Couldn't read that file.")); return; }
  if (d.svfile) { const f = t.files && t.files[0]; t.value = ""; if (!f) return; f.text().then((txt) => { sv.text = ""; const r = parseSnapVault(txt); sv.err = r.err || ""; sv.res = r.err ? null : r; refreshSheet(); }).catch(() => { sv.err = "Couldn't read that file."; refreshSheet(); }); return; }
  if (d.svchk) { sv[d.svchk] = t.checked; refreshSheet(); return; }
  if (d.deck) { render(); return; }
  if (d.bind && t.tagName === "SELECT") { render(); return; }
});

const MODES = ["Ranked", "Conquest", "Friendly", "Draft", "High Voltage", "Deadpool's Diner", "Sanctum Showdown", "Event", "Limited-time mode", "Other"];
const modeOf = (m) => (m && m.mode) || "Ranked";
const APP_URL = window.SNAPSTAT_STANDALONE ? location.origin + location.pathname : "https://rhaddaddy.github.io/snap-stat/";
function progBar(have, of, label) { return `<div class="bar" role="img" aria-label="${esc(label || `${have} of ${of}`)}"><i style="width:${clamp(pct(have, of), 0, 100)}%"></i></div>`; }
const avgCubes = (list) => (list.length ? Math.round((list.reduce((s, m) => s + num(m.cubes), 0) / list.length) * 10) / 10 : 0);
const winPct = (list) => pct(list.filter((m) => m.result === "W").length, list.filter((m) => m.result !== "T").length);
const plural = (n, w, many) => `${fmt(n)} ${n === 1 ? w : many || w + "s"}`;

/* ============ Rank climb ============ */
// Cubes per rank: 7 in the game now (the home screen shows 4/7), read from screenshots when it changes. Infinite is rank 100.
function cpr() { return clamp(Math.round(num(S.cubesPerRank)) || 7, 3, 20); }
function seasonAt(ts) { return seasons().find((s) => ts >= s.startTs && ts <= s.endTs) || null; }
function rankFromStr(r) { const s = String(r || "").trim(); if (/^inf/i.test(s)) return 100; const n = parseInt(s, 10); return n >= 1 && n <= 100 ? n : 0; }
const rankStr = (r) => (r >= 100 ? "Infinite" : String(r));
// The game drops you about 30 ranks, to a multiple of 10, when a new season starts.
const seasonReset = (r) => (r >= 100 ? 70 : Math.max(1, Math.floor((r - 30) / 10) * 10));
function climbNow() {
  const c = obj(S.climb); if (!c.at) return null;
  let total = clamp(num(c.rank), 1, 100) * cpr() + clamp(num(c.cubes), 0, cpr() - 1);
  let peak = total, games = 0, floor10 = total >= 10 * cpr();
  const base = seasonAt(c.at), endTs = base ? base.endTs : Infinity;
  const ms = realMatches().filter((m) => m.ts > c.at && m.ts <= endTs && modeOf(m) === "Ranked").sort((a, b) => a.ts - b.ts);
  for (const m of ms) {
    if (total >= 100 * cpr()) break;
    total = Math.min(100 * cpr(), Math.max(floor10 ? 10 * cpr() : cpr(), total + num(m.cubes)));
    if (total >= 10 * cpr()) floor10 = true;
    peak = Math.max(peak, total); games++;
  }
  const cur = currentSeason();
  const stale = !!(cur && ((base && cur.id !== base.id) || (!base && c.at < cur.startTs)));
  const rank = Math.floor(total / cpr());
  return { rank, cubes: rank >= 100 ? 0 : total % cpr(), inf: rank >= 100, peak: Math.floor(peak / cpr()), games, stale };
}
/* Peak ranks: each season keeps its own (it starts again from your rank in the new season), and there's an all-time best.
   A peak never goes down. S.me.peak is this season's; S.me.peakAll is the best ever. */
function notePeak(rank) {
  const rk = typeof rank === "number" ? Math.round(rank) : rankFromStr(rank); if (!(rk >= 1 && rk <= 100)) return false;
  const cs = currentSeason(), sid = cs ? cs.id : "";
  if (S.me.peakSeason !== sid) { S.me.peakSeason = sid; S.me.peak = cs && obj(S.ranks["s:" + sid]).peak ? S.ranks["s:" + sid].peak : ""; }
  let changed = false;
  if (rk > rankFromStr(S.me.peak)) { S.me.peak = rankStr(rk); changed = true; }
  if (cs) { const rr = (S.ranks["s:" + sid] = obj(S.ranks["s:" + sid])); if (rk > rankFromStr(rr.peak)) { rr.peak = rankStr(rk); changed = true; } }
  if (rk > rankFromStr(S.me.peakAll)) { S.me.peakAll = rankStr(rk); S.me.peakAllAt = Date.now(); S.me.peakAllSeason = cs ? cs.name : ""; changed = true; }
  return changed;
}
// The all-time peak also counts every season you've recorded
function peakAllTime() { let best = rankFromStr(S.me.peakAll); for (const r of Object.values(obj(S.ranks))) best = Math.max(best, rankFromStr(obj(r).peak), rankFromStr(obj(r).end)); return best ? rankStr(best) : ""; }
function syncRankFromClimb() {
  const st = climbNow(); if (!st || st.stale) return false;
  const r = rankStr(st.rank), cs = currentSeason();
  // The replay's peak only counts this season if the rank it starts from was seen this season
  const inSeason = !cs || num(obj(S.climb).at) >= cs.startTs;
  const before = JSON.stringify([S.me.rank, S.me.peak, S.me.peakAll, cs ? S.ranks["s:" + cs.id] : null]);
  S.me.rank = r; notePeak(st.rank); if (inSeason) notePeak(st.peak);
  if (cs) { const rr = (S.ranks["s:" + cs.id] = obj(S.ranks["s:" + cs.id])); rr.end = r; }
  return JSON.stringify([S.me.rank, S.me.peak, S.me.peakAll, cs ? S.ranks["s:" + cs.id] : null]) !== before;
}
function onMatchSaved(m) { const a = syncRankFromClimb(), b = afterMatchChecks(m); if (a || b) save(); }
/* One-tap save from Quick log (and voice logging). */
function quickSaveMatch(r, c, extra = {}) {
  const q = obj(S.quick); const last = realMatches()[0];
  const deckId = q.deckId !== undefined ? q.deckId : last ? last.deckId || "" : ""; const mode = q.mode || (last ? modeOf(last) : "Ranked");
  const d = S.decks.find((x) => x.id === deckId);
  const m = { id: uid(), ts: Date.now(), result: r, cubes: r === "W" ? c : r === "L" ? -c : 0, mode, deckId: d ? d.id : "", deckName: d ? d.name : "", oppName: "", oppCards: [], snapped: !!qk.f.snapped, oppSnapped: !!qk.f.oppSnapped, retreated: !!qk.f.retreated, oppRetreated: !!qk.f.oppRetreated, turn: 6, bot: "unsure", notes: "", quick: true, ...extra };
  putMatch(m); S.quick = { ...q, deckId: m.deckId, mode }; syncRankFromClimb(); afterMatchChecks(m); save(); qk.last = m; qk.f = {}; refreshSheet(); render();
  toast(`${r === "W" ? "Win" : r === "L" ? "Loss" : "Tie"} saved${c ? ` (${signed(m.cubes)})` : ""}`);
  return m;
}
function climbPace() {
  const ranked = realMatches().filter((m) => modeOf(m) === "Ranked");
  const recent = ranked.slice(0, 50);
  const last14 = ranked.filter((m) => m.ts >= Date.now() - 14 * DAY);
  const span = last14.length ? Math.max(1, Math.min(14, (Date.now() - Math.min(...last14.map((m) => m.ts))) / DAY)) : 0;
  return { cpg: recent.length ? recent.reduce((s, m) => s + num(m.cubes), 0) / recent.length : 0, gpd: span ? last14.length / span : 0, n: recent.length };
}
function climbForm(st) {
  const r = st ? st.rank : rankFromStr(S.me.rank) || "", c = st ? st.cubes : "";
  return `<div class="panel stack"><p class="small">Enter your rank from the game. Ranked matches you log after this move it up and down by their cubes, so your rank stays current here and on your profile.</p>
    <div class="grid2"><label class="f">Rank now (1–100)<input type="number" id="cl-rank" min="1" max="100" inputmode="numeric" value="${esc(r)}"></label><label class="f">Cubes into this rank (0–9)<input type="number" id="cl-cubes" min="0" max="9" inputmode="numeric" value="${esc(c)}"></label></div>
    <div class="row"><button class="btn snap" data-a="climbSave">Save rank</button>${st ? `<button class="btn ghost" data-a="climbCancel">Cancel</button>` : ""}</div>

function climbPanel() {
  const st = climbNow();

    const sug = seasonReset(st.rank);
    return `<div class="panel stack"><b>A new season started</b><p class="small">Last season you reached rank ${esc(rankStr(st.rank))}. The game usually drops you about 30 ranks, so you'd start this season around rank ${sug}.</p>
      <div class="row"><button class="btn snap" data-a="climbReset" data-v="${sug}">Start at rank ${sug}</button><button class="btn" data-a="climbEdit">Enter my rank</button></div></div>`;
  }
  const cs = currentSeason();

  const need = (100 - st.rank) * cpr() - st.cubes; const pace = climbPace();

    ${progBar(st.cubes, cpr(), `${st.cubes} of ${cpr()} cubes to the next rank`)}
    <div class="tiles"><div class="tile"><div class="k">Cubes to Infinite</div><div class="v">${fmt(need)}</div></div>
      <div class="tile"><div class="k">Cubes a game</div><div class="v ${cpg >= 0 ? "pos" : "neg"}">${pace.n ? signed(cpg) : "—"}</div></div>
      <div class="tile"><div class="k">Games to go</div><div class="v">${games ? "≈" + fmt(games) : "—"}</div></div>
      <div class="tile"><div class="k">Days at your pace</div><div class="v">${days ? "≈" + fmt(days) : "—"}</div></div></div>
    ${track}
    <p class="muted small">${pace.n ? `Pace from your last ${plural(pace.n, "Ranked game")}${pace.gpd ? `, about ${Math.round(pace.gpd * 10) / 10} a day` : ""}.` : "Log Ranked matches to see your pace."}${cs ? ` Season ends in ${cdSpan(cs.endTs)}.` : ""} Check it against the game now and then: a match you forget to log makes it drift.</p>
    <div><button class="btn sm ghost" data-a="climbEdit">Fix rank</button></div></div>`;
}

/* ============ Snap & retreat coach ============ */
function coachHtml(ms) {
  const g = ms.filter((m) => ["W", "L", "T"].includes(m.result));
  if (g.length < 8) return `<p class="muted small">Log at least 8 matches${g.length ? ` (${g.length} so far)` : ""} to get snap and retreat tips.</p>`;
  const sn = g.filter((m) => m.snapped), ns = g.filter((m) => !m.snapped);
  const ret = g.filter((m) => m.retreated), full = g.filter((m) => m.result === "L" && !m.retreated);
  const os = g.filter((m) => m.oppSnapped), osStay = os.filter((m) => !m.retreated), osRet = os.filter((m) => m.retreated);
  const wins = g.filter((m) => m.result === "W"); const snapRate = pct(sn.length, g.length);
  const tips = [];
  if (sn.length >= 3 && winPct(sn) >= 60 && snapRate < 30) tips.push(`You win ${winPct(sn)}% of the games you snap, but you only snap in ${snapRate}% of them. Snapping more when you're ahead earns more cubes.`);
  if (sn.length >= 5 && winPct(sn) < 45) tips.push(`You win just ${winPct(sn)}% of the games you snap. Try snapping a turn later, once you've seen more of their cards.`);
  if (full.length >= 4 && avgCubes(full) <= -3) tips.push(`Losses you play to the end cost ${-avgCubes(full)} cubes each on average. Retreat sooner when you can't win two locations.`);
  if (osStay.length >= 3 && winPct(osStay) < 45) tips.push(`When they snap and you stay in, you win ${winPct(osStay)}% and average ${signed(avgCubes(osStay))} cubes. Retreating more often after their snap would save cubes.`);
  if (osStay.length >= 3 && winPct(osStay) >= 60) tips.push(`You win ${winPct(osStay)}% of games where they snap and you stay. Their snap is often a bluff against you.`);
  if (wins.length >= 5 && avgCubes(wins) < 2.5) tips.push(`Your wins average only ${signed(avgCubes(wins))} cubes. Snapping when you're confident doubles what a win is worth.`);
  if (ret.length >= 5 && full.length * 3 < ret.length && pct(ret.length, g.length) > 35) tips.push(`You retreat from ${pct(ret.length, g.length)}% of games. Playing out a few more close ones could turn some into wins.`);
  const timed = sn.filter((m) => num(m.snapTurn) > 0);
  const buckets = [["Turns 1–3", (t) => t <= 3], ["Turns 4–5", (t) => t >= 4 && t <= 5], ["Turn 6+", (t) => t >= 6]].map(([l, f]) => { const list = timed.filter((m) => f(num(m.snapTurn))); return { l, list }; }).filter((b) => b.list.length);
  const early = buckets.find((b) => b.l === "Turns 1–3"), late = buckets.find((b) => b.l === "Turn 6+");
  if (early && late && early.list.length >= 3 && late.list.length >= 3 && winPct(early.list) + 15 < winPct(late.list)) tips.push(`Your early snaps win ${winPct(early.list)}%, your turn 6 snaps ${winPct(late.list)}%. Waiting a bit pays off for you.`);
  if (!tips.length) tips.push("Your snapping and retreating look balanced. Keep logging matches to spot patterns.");
  const tile = (k, v, cls = "") => `<div class="tile"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
  return `<div class="tiles">${tile("You snap", snapRate + "%")}${tile("Win % when you snap", sn.length ? winPct(sn) + "%" : "—")}${tile("Win % when you don't", ns.length ? winPct(ns) + "%" : "—")}
    ${tile("Avg cubes when you snap", sn.length ? signed(avgCubes(sn)) : "—")}${tile("Avg cost of a retreat", ret.length ? signed(avgCubes(ret)) : "—")}${tile("Avg cost of a full loss", full.length ? signed(avgCubes(full)) : "—")}
    ${tile("Win % when they snap", os.length ? winPct(os) + "%" : "—")}${tile("You retreat after their snap", os.length ? pct(osRet.length, os.length) + "%" : "—")}</div>
    <div class="panel stack"><span class="eyebrow">Tips from your games</span><ul class="tips">${tips.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>
    ${buckets.length ? `<div class="tbl-wrap"><table><thead><tr><th>You snapped on</th><th class="n">Games</th><th class="n">Win %</th><th class="n">Avg cubes</th></tr></thead><tbody>${buckets.map((b) => `<tr><td>${b.l}</td><td class="n">${b.list.length}</td><td class="n">${winPct(b.list)}%</td><td class="n">${signed(avgCubes(b.list))}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">Tick “You snapped” in the live tracker when you snap and the app also learns which turn works best for you.</p>`}`;
}

/* ============ Matchups ============ */
const ARCH_NAMES = { D: "Destroy", X: "Discard", M: "Move", O: "Ongoing", B: "Buff", P: "Ramp", C: "Disrupt", S: "Card generation", J: "Gives you cards", L: "Location" };
function cardTags(c) { return c && arr(c.tags).length ? c.tags : tagsFrom(c ? c.ability : ""); }
function archetypeOf(names) {
  const cs = arr(names).map((n) => cardByName(n)).filter(Boolean); if (cs.length < 2) return "";
  const cnt = {}; cs.forEach((c) => cardTags(c).forEach((t) => { if (t !== "R" && ARCH_NAMES[t]) cnt[t] = (cnt[t] || 0) + 1; }));
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  if (top && top[1] >= 2) return ARCH_NAMES[top[0]];
  const avg = cs.reduce((s, c) => s + num(c.cost), 0) / cs.length;
  return avg <= 2.5 ? "Low-cost" : avg >= 4 ? "High-cost" : "Mixed";
}

  const worst = crow.filter((r) => r.wr < 50).sort((a, b) => a.wr - b.wr || b.l.length - a.l.length).slice(0, 8), best = crow.filter((r) => r.wr >= 50).sort((a, b) => b.wr - a.wr || b.l.length - a.l.length).slice(0, 5);
  const ctab = (rows) => `<div class="tbl-wrap"><table><thead><tr><th>Their card</th><th class="n">Games</th><th class="n">Win %</th><th class="n">Cubes</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${esc(r.n)}</td><td class="n">${r.l.length}</td><td class="n ${r.wr >= 50 ? "pos" : "neg"}">${r.wr}%</td><td class="n">${signed(r.l.reduce((s, m) => s + num(m.cubes), 0))}</td></tr>`).join("")}</tbody></table></div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Their deck type</th><th class="n">Games</th><th class="n">W-L</th><th class="n">Win %</th><th class="n">Cubes</th></tr></thead><tbody>${arch.map(({ a, list }) => { const s = statsFor(list); return `<tr><td>${/^Too few/.test(a) ? esc(a) : `<button class="linkish" data-a="muOpen" data-v="${esc(a)}">${esc(a)}</button>`}</td><td class="n">${s.games}</td><td class="n">${s.w}-${s.l}</td><td class="n">${s.wr}%</td><td class="n ${s.cubes >= 0 ? "pos" : "neg"}">${signed(s.cubes)}</td></tr>`; }).join("")}</tbody></table></div>
    <p class="muted small">Deck type is a guess from the effects of the cards they showed. Tap one for your best decks and cards against it, and to keep notes.</p>
    ${worst.length ? `<h3>Cards that beat you</h3>${ctab(worst)}` : crow.length ? "" : `<p class="muted small">Once you've seen a card in 3 or more games, you'll see how you do against it.</p>`}

/* Stats for each game mode, grouped: Ranked, Conquest and Friendly, then events and limited-time modes, with an overall row */

let PACKS = null, packVer = 0; const PACK_CACHE = "snapstat.packs";
function usePacks(j, fromCache) {

  refreshView(); return true;
}
async function loadPacks() {

  try { const c = localStorage.getItem(PACK_CACHE); if (c) usePacks(JSON.parse(c), true); } catch { /* no saved copy */ }
  for (const u of catUrls("packs.json")) {
    try {
      const r = await fetch(u, { cache: "no-cache" }); if (!r.ok) continue;
      const text = await r.text(); const j = JSON.parse(text);
      if (PACKS && j.updated && j.updated === PACKS.updated) return;
      if (!usePacks(j, false)) continue;
      try { localStorage.setItem(PACK_CACHE, text); } catch { /* fetched again next time */ }
      return;
    } catch { /* try the next copy */ }
  }
}

  const inSeasonal = new Set(seasonal.flatMap((p) => p.keys));
  const old = [5, 4, 3].map((sr) => ({ id: "old" + sr, name: `Old Series ${sr}`, kind: "old", series: String(sr), price: num(PACKS.old[sr]) || { 5: 4000, 4: 2000, 3: 650 }[sr],
    keys: allCards().filter((c) => !c.upcoming && !c.custom && !c.catModeOnly && seriesOf(c) === "Series " + sr && !inSeasonal.has(c.key)).map((c) => c.key) }));
  const map = sfVarMap(); const byCat = new Map(allVariants().filter((v) => v.cat).map((v) => [v.cat, v]));
  const special = PACKS.packs.filter((p) => p.kind === "special" && (!p.end || p.end >= today)).map((p) => ({ ...p, id: p.slug, vars: arr(p.variants).map((vid) => { const cv = map.get(vid); return { vid, v: cv ? byCat.get(cv.cat) : null }; }) }));

  nat.busy = true;

  // (free keys allow a few answers a minute) stays for next time instead of being lost.
  setTimeout(async () => {

        if (it.meta) { try { f.snapMeta = JSON.parse(it.meta); } catch { /* no notes */ } } // what the tracker noticed during the match (how fast the opponent played)
        if (/json/.test(f.type)) { NATIVE.done(it.id); if (it.source === "webshop") { applyWebshopProgress(await f.text()); render(); continue; } try { svQuickSync(await f.text()); } catch { toast("Couldn't read that SnapVault file."); } continue; }

/* ============ Card progress: boosters, upgrades, Infinity Splits, finishes, flares, borders, Split Reroll Coins ============

   Every change goes in a log, so you can see boosters gained and spent, and what each upgrade or split gave you. */
const UP_LEVELS = ["Common", "Uncommon", "Rare", "Epic", "Legendary", "Ultra", "Infinity"];
// What the step INTO each rarity costs: [credits, boosters, Collection Levels]
const STEP = [null, [25, 5, 1], [100, 10, 2], [200, 20, 4], [300, 30, 6], [400, 40, 8], [500, 50, 10]];
// The game's current Infinity Split effects (Marvel Snap Zone, 2026). Older names stay valid for splits logged before.
const SPLIT_FINISHES = ["Foil", "Prism", "Pink Rays", "Black and White Rays", "Red Rays", "Blue Rays", "Green Rays", "Orange Rays", "Bananas", "Copper Metallic", "Water", "Galactic Storm", "Refraction", "Gold Metallic", "Foil Metallic", "Fire", "Ink", "Gold", "Frosted Glass", "Psychedelic", "Glass Circuits", "Cosmic", "Steel Metallic", "Gilded Prism", "Gold Prism", "Black Prism", "Wakandan Glass"];
const SPLIT_FLARES = [...["Green", "Blue", "Red", "Purple", "White", "Gold", "Black", "Rainbow"].flatMap((c) => [`${c} Tone`, `${c} Stardust`, `${c} Glimmer`]), "Green Embers", "Blue Embers", "Fire Embers", "Cosmic", "Bananas", "Rainbow Confetti", "Neon Trails", "Bubbles", "Snowflakes", "Galactic Storm", ...["Red", "Blue", "Purple", "White", "Green", "Gold", "Rainbow", "Black"].map((c) => `${c} Krackle`), "Purple Wakandan Tech", "Gold Wakandan Tech", "Gold Diamond Flare"];
const BORDERS = ["Common", "Uncommon", "Rare", "Epic", "Legendary", "Ultra", "Infinity"];
// Every Custom Card border once the border list has loaded, the upgrade-level ones until then.
const borderNames = () => (typeof BDL !== "undefined" && BDL ? [...new Set(BDL.list.map((b) => b.name || b.id))] : BORDERS);

function prog(k) {
  S.prog = obj(S.prog);
  let p = S.prog[k];
  if (!p) {
    p = S.prog[k] = { b: null, ml: null, base: null, vr: {}, splits: [], borders: [], custom: null };
    // Splits counted before this page existed
    const old = obj(obj(S.splits)[k]), n = num(old.n), fins = arr(old.f);

}
const hasProg = (k) => !!(S.prog && S.prog[k]);
function progLogAdd(e) { const l = arr(S.progLog); l.push({ t: Date.now(), ...e, ...(typeof progTag !== "undefined" && progTag ? { tag: progTag } : {}) }); S.progLog = l.slice(-3000); }
// Keep the old split counter in step, for the parts of the app that read it
function syncSplitCount(k) { const p = prog(k); S.splits = obj(S.splits); S.splits[k] = { n: p.splits.length, f: p.splits.map((s) => s.fin).filter(Boolean) }; }
const rarityIdx = (v) => { if (v === null || v === undefined || v === "") return null; const i = typeof v === "number" ? v : UP_LEVELS.findIndex((r) => keyOf(r) === keyOf(v)); return i >= 0 && i < UP_LEVELS.length ? i : null; };
const nextStep = (r) => (r === null || r >= 6 ? null : STEP[r + 1]);

/* Copies you own: the base card, owned variants and splits, each with its upgrade level */
function progCopies(k) {
  const p = prog(k), out = [{ id: "base", label: "Base card", r: p.base }];
  allVariants().filter((v) => v.card === k && v.owned).forEach((v) => out.push({ id: "v:" + v.id, label: v.name || "Variant", r: rarityIdx(p.vr[v.id]) }));
  p.splits.forEach((s, i) => out.push({ id: "s:" + s.id, label: `Split ${i + 1}${s.fin || s.fl ? ` · ${[s.fin, s.fl].filter(Boolean).join(" + ")}` : ""}`, r: rarityIdx(s.r) }));

}
function setCopyRarity(k, id, r) {

/* Upgrade one copy a step: spends the card's boosters and your credits, and adds Collection Level */
function upgradeCopy(k, id) {
  const p = prog(k), from = copyRarity(k, id) ?? 0, step = nextStep(from); if (!step) return "That copy is already Infinity.";

  if (num(S.wallet.credits) && num(S.wallet.credits) < cr) return `It needs ${fmt(cr)} credits and you have ${fmt(num(S.wallet.credits))}.`;
  if (p.b !== null) p.b = num(p.b) - bo;
  if (num(S.wallet.credits)) S.wallet.credits = num(S.wallet.credits) - cr;

/* A new Infinity Split: the new copy starts at Common. A reroll can be free (Mastery 10+) or cost a Split Reroll Coin. */
function addSplit(k, fin, fl, reroll) {

}

/* ---------- The PC game's collection file ---------- */
/* MARVEL SNAP on PC keeps your collection in CollectionState.json. Every card in it has a CardDefId (the card) and, for a
   variant, an ArtVariantDefId like "Abomination_03". Decks are lists of CardDefIds with a name. Nothing leaves the phone. */
function readCollectionFile(text) {
  let j; try { j = JSON.parse(String(text || "").replace(/^﻿/, "")); } catch { return null; }
  const cards = new Set(), vars = new Set(), decks = [];
  const walk = (o, depth) => {
    if (!o || typeof o !== "object" || depth > 40) return;
    if (Array.isArray(o)) { o.forEach((x) => walk(x, depth + 1)); return; }
    const id = typeof o.CardDefId === "string" ? o.CardDefId : "";
    if (id && /^[A-Za-z0-9]+$/.test(id)) {
      cards.add(id);
      const v = typeof o.ArtVariantDefId === "string" ? o.ArtVariantDefId : "";
      if (/^[A-Za-z0-9]+_\d{1,3}$/.test(v)) vars.add(v);
    }
    if (typeof o.Name === "string" && Array.isArray(o.Cards) && o.Cards.length >= 6 && o.Cards.length <= 12 && o.Cards.every((c) => c && typeof c.CardDefId === "string"))
      decks.push({ name: o.Name.slice(0, 60), cards: o.Cards.map((c) => c.CardDefId), vars: o.Cards.map((c) => (typeof c.ArtVariantDefId === "string" ? c.ArtVariantDefId : "")) });
    for (const [k, v] of Object.entries(o)) if (v && typeof v === "object" && k !== "$ref") walk(v, depth + 1);
  };
  walk(j, 0);
  return cards.size ? { cards: [...cards], vars: [...vars], decks } : null;
}
// The game's card ID (CardDefId) → the card.
function cardByDefId(id) { id = String(id || ""); if (!id) return null; return allCards().find((c) => c.catId === id) || cardByCode(cardCode(id)) || cardByCode(id) || null; }
// "Abomination_03" → the catalog variant with that number.
function variantByDefId(def) {
  const m = String(def).match(/^([A-Za-z0-9]+)_(\d{1,3})$/); if (!m) return null;
  const c = cardByDefId(m[1]); if (!c) return null;
  const n = Number(m[2]);
  return allVariants().find((v) => v.card === c.key && v.cat && catOrder(v) === n) || null;
}
let collImp = null;
function applyCollectionFile(text) {
  const r = readCollectionFile(text);
  if (!r) { toast("That doesn't look like a MARVEL SNAP collection file."); return; }
  let cardsNew = 0, varsNew = 0, unknown = 0;
  for (const id of r.cards) { const c = cardByDefId(id); if (!c) { unknown++; continue; } if (!S.owned[c.key]) { S.owned[c.key] = true; cardsNew++; } }
  for (const id of r.vars) { const v = variantByDefId(id); if (v && setVarOwned(v, true, "file")) varsNew++; }
  const have = new Set(S.decks.map((d) => keyOf(d.name)));
  collImp = { cards: r.cards.length, cardsNew, vars: r.vars.length, varsNew, unknown, decks: r.decks.filter((d) => !have.has(keyOf(d.name))) };
  S.collFileAt = Date.now();
  save(); render(); openSheet(collImpSheet);
}
function collImpSheet() {

    <div class="kpis">${`<div class="kpi"><b class="num">${fmt(r.cards)}</b><span>cards in the file${r.cardsNew ? ` · ${fmt(r.cardsNew)} newly ticked` : ""}</span></div><div class="kpi"><b class="num">${fmt(r.vars)}</b><span>variants${r.varsNew ? ` · ${fmt(r.varsNew)} newly ticked` : ""}</span></div>`}</div>
    ${r.unknown ? `<p class="muted small">${r.unknown} card${r.unknown === 1 ? "" : "s"} in the file aren't in SNAP Stat's card list yet. They'll be picked up after the next daily card update if you read the file again.</p>` : ""}
    <p class="muted small">Variants you ticked or unticked yourself weren't changed.</p>
    ${r.decks.length ? `<h3>Decks in the file</h3><div class="list">${r.decks.map((d, i) => `<div class="li"><div class="grow"><div class="t">${esc(d.name)}</div><div class="s">${d.cards.map((id) => esc((cardByDefId(id) || { name: id }).name)).join(", ")}</div></div><button class="btn sm" data-a="collDeck" data-i="${i}">${d.added ? "Added" : "Add"}</button></div>`).join("")}</div>
      ${r.decks.length > 1 ? `<button class="btn block" data-a="collDeck" data-i="all">Add all ${r.decks.length} decks</button>` : ""}` : ""}

function addCollDeck(d) {

  const nd = newDeck(d.name, keys, keys.length === 12 ? "active" : "draft");

}

/* ---------- Matchups: how you do against each kind of deck, your best answers, and your own notes ---------- */
function oppArch(m) { return archetypeOf(m.oppCards) || ""; }
function matchupData(arch, ms = realMatches()) {
  const list = ms.filter((m) => m.result && arr(m.oppCards).length && oppArch(m) === arch);
  const st = statsFor(list);
  const decks = {}; list.forEach((m) => { const k = m.deckId || m.deckName || ""; if (!k) return; (decks[k] = decks[k] || { name: m.deckName || "No deck", list: [] }).list.push(m); });
  const deckRows = Object.values(decks).map((d) => ({ name: d.name, st: statsFor(d.list) })).filter((d) => d.st.games >= 2).sort((a, b) => b.st.wr - a.st.wr || b.st.games - a.st.games).slice(0, 4);
  const mine = cardAnalytics(list.filter((m) => m.tracked)).filter((r) => r.played >= 2).sort((a, b) => b.wr - a.wr || b.played - a.played).slice(0, 5);
  const theirs = {}; list.forEach((m) => new Set(arr(m.oppCards)).forEach((n) => (theirs[n] = (theirs[n] || 0) + 1)));
  return { list, st, deckRows, mine, theirs: Object.entries(theirs).sort((a, b) => b[1] - a[1]).slice(0, 8) };
}
