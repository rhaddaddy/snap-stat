# Checks run by hand (Actions › Probe › Run workflow). Results go to the probe-results branch.
name: Probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/probe-cardbacks.py
      - name: Save the results
        run: |
          git config user.email noreply@anthropic.com && git config user.name "SNAP Stat probe"
          mv probe /tmp/probe
          git checkout --orphan probe-results && git rm -rf --cached . -q && rm -rf ./* .github .gitignore 2>/dev/null; cp -r /tmp/probe/* .
          git add -A && git commit -qm "Probe results for ${GITHUB_SHA::7}" && git push -f origin probe-results
