# Temporary (round 4): saves copies of a few public pages so their formats can be checked. Safe to delete.
name: Peek at data sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/peek.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p debug
          UA="Mozilla/5.0 (compatible; SNAP-Stat-card-updater/1.0)"
          get() { curl -sSL -A "$UA" --max-time 60 -o "debug/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 failed"; }
          get sf-history.html "https://snap.fan/cards/history/"
          get sf-spotlights.html "https://snap.fan/cards/spotlights/"
          get sf-decks-meta.html "https://snap.fan/decks/meta/"
          get sf-schedule.html "https://snap.fan/news/schedule/"
          get sf-series-changes.html "https://snap.fan/cards/series-changes/"
          get sf-card-tier.html "https://snap.fan/cards/tier-list/"
          get sf-bundles-2.html "https://snap.fan/bundles/page/2/"
          get msz-getinfo-decks.json "https://marvelsnapzone.com/getinfo/?searchtype=decks"
          get msz-getinfo-meta.json "https://marvelsnapzone.com/getinfo/?searchtype=decks&decktype=meta"
          get msp-getdecks.json "https://static2.marvelsnap.pro/snap/do.php?cmd=getdecks"
          get msp-decks.html "https://marvelsnap.pro/decks/"
          get msp-meta.html "https://marvelsnap.pro/meta/"
          get untapped-meta.html "https://snap.untapped.gg/en/meta"
          get snapvault-decks.html "https://www.snapvault.app/decks"
          get snapvault-meta.html "https://www.snapvault.app/meta"
          ls -la debug
          for f in debug/*.html; do head -c 600000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add debug
          git diff --cached --quiet || (git commit -m "Peek at data sources" && git pull --rebase && git push)
