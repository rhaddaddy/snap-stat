# Temporary: saves a bundles page so bundle contents can be read. Removed afterwards.
name: Peek at bundle pages
on:
  push:
    branches: [main]
    paths: [".github/workflows/peek.yml"]
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          UA="Mozilla/5.0 (compatible; SNAP-Stat-card-updater/1.0)"
          curl -sSL -A "$UA" -o debug/bundles.html -w "bundles %{http_code} %{size_download}\n" "https://snap.fan/bundles/" | tee debug/codes.txt
          link=$(grep -oE 'href="/bundles/[A-Za-z0-9_-]+/"' debug/bundles.html | head -1 | sed 's/href="//;s/"$//')
          echo "detail $link" >> debug/codes.txt
          if [ -n "$link" ]; then curl -sSL -A "$UA" -o debug/bundle-detail.html -w "detail %{http_code} %{size_download}\n" "https://snap.fan$link" >> debug/codes.txt; fi
          curl -sSL -A "$UA" -o debug/sc-bundles.html -w "snapcomplete %{http_code} %{size_download}\n" "https://snapcomplete.com/save/bundles" >> debug/codes.txt || true
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add debug; git commit -m "Peek at bundle pages" && git pull --rebase && git push
