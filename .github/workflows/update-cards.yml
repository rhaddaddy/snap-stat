# Twice a day, once just after the game's daily reset (and right away whenever this file or a script changes) this refreshes:
#   card-data.json        card art, details, every variant and location (Marvel Snap Zone)
#   schedule.json         seasons, limited-time events, bundles and event shops (snap.fan)
#   balance-history.json  every cost, power and ability change (snap.fan)
#   variant-details.json  each variant's name, artists, rarity, source and release date (snap.fan)
#   albums.json           variant albums with their rewards, and card split finishes (snap.fan)
#   packs.json            the Card Shop's Snap Packs: prices, dates and contents (snap.fan)
#   promo-codes.json      web shop promo codes and whether they still work (Dexerto, Popverse)
#   art.json              each season's key art and every card back (Marvel Snap Zone, checked against snap.fan; fixed pictures in cardbacks/)
#   borders.json          every Custom Card border, with flat (and moving) frames in borders/ (Marvel Snap Zone, snap.fan)
#   webshop.json          the web shop's bundles, prices and Web Points track (the shop's public catalog)
name: Update card data

on:
  schedule:
    - cron: "23 10 * * *"
    # Right after the game's daily reset (19:00 UTC: 12:00 PM Pacific in summer, 11:00 AM in winter), when new seasons, events and shop items appear
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-cards.yml"
      - "scripts/update-cards.mjs"
      - "scripts/update-schedule.mjs"
      - "scripts/update-history.mjs"
      - "scripts/update-variants.mjs"
      - "scripts/update-albums.mjs"
      - "scripts/update-packs.mjs"
      - "scripts/update-borders.py"
      - "scripts/update-promos.mjs"
      - "scripts/update-art.py"
      - "scripts/update-webshop.mjs"
      - "schedule-overrides.json"

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Each step has its own time limit and one failing doesn't stop the others (they use the card data already saved)
      - name: Download cards, variants and locations
        run: node scripts/update-cards.mjs
        continue-on-error: true
        timeout-minutes: 8
      - name: Download seasons, events and shops
        run: node scripts/update-schedule.mjs
        continue-on-error: true
        timeout-minutes: 10
      - name: Download balance history
        run: node scripts/update-history.mjs
        continue-on-error: true
        timeout-minutes: 5
      - name: Download variant details
        run: node scripts/update-variants.mjs
        continue-on-error: true
        timeout-minutes: 28
      - name: Download albums and split finishes
        run: node scripts/update-albums.mjs
        continue-on-error: true
        timeout-minutes: 8
      - name: Download Snap Packs
        run: node scripts/update-packs.mjs
        continue-on-error: true
        timeout-minutes: 4
      - name: Check promo codes
        run: node scripts/update-promos.mjs
        continue-on-error: true
        timeout-minutes: 3
      - name: Download the web shop's bundles
        run: node scripts/update-webshop.mjs
        continue-on-error: true
        timeout-minutes: 2
      - name: Download Custom Card borders
        id: borders
        run: pip install --quiet pillow numpy && python3 scripts/update-borders.py
        continue-on-error: true
        timeout-minutes: 10
      - name: Download season art and card backs
        id: art
        run: (sudo apt-get install -y -qq tesseract-ocr > /dev/null 2>&1 || true) && pip install --quiet pillow numpy opencv-python-headless pytesseract && python3 scripts/update-art.py
        continue-on-error: true
        timeout-minutes: 12
      - name: Save changes
        if: always()
        env:
          BORDERS_OK: ${{ steps.borders.outcome }}
          ART_OK: ${{ steps.art.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add card-data.json card-data-sample.json
          for f in schedule.json balance-history.json variant-details.json albums.json packs.json borders.json promo-codes.json art.json webshop.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          # Picture folders only when their script finished, so a crash halfway can't commit deleted pictures
          # (and a step that failed has its half-done changes thrown away, or git can't pull before pushing)
          if [ "$BORDERS_OK" = success ]; then
            if [ -d borders ]; then git add -A borders; fi
          else
            git checkout HEAD -- borders borders.json 2>/dev/null || true; git clean -fdq borders 2>/dev/null || true
          fi
          if [ "$ART_OK" = success ]; then
            if [ -d cardbacks ]; then git add -A cardbacks; fi
          else
            git checkout HEAD -- cardbacks art.json 2>/dev/null || true; git clean -fdq cardbacks 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update card data"
            git pull --rebase
            git push
          fi
