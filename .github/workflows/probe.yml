# One-off look at border images and card art (run by hand or when this file changes)
name: Probe art
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml", "scripts/probe_art.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 scripts/probe_art.py || true
      - run: |
          git config user.email noreply@anthropic.com && git config user.name "SNAP Stat probe"
          mkdir -p /tmp/p && cp -r probe /tmp/p/ 2>/dev/null || mkdir -p /tmp/p/probe
          git checkout --orphan probe-results && git rm -rf --cached . -q && rm -rf probe && cp -r /tmp/p/probe probe
          git add probe && git commit -qm "Art probe" && git push -f origin probe-results
